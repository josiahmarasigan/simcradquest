  /* ---------------- Wellness (Phase 8) ---------------- */
  const WL_ST_KEY = { 'STRONG FOUNDATION': 'strong', 'DOING OKAY / ROOM TO IMPROVE': 'okay', 'NEEDS ATTENTION': 'attention', 'PRIORITY AREA': 'priority' };
  let wlCfg = null;
  let wlHomeData = null;
  let wlCmp = '';
  let wlW = null;        // wellness check in progress
  let wlLabsData = null;
  let wlBodyData = null;
  let wlFlagsTab = 'open';

  function wlStKey(s) { return WL_ST_KEY[s] || 'nodata'; }
  function wlStLabel(s) { return t('wl.st.' + wlStKey(s)); }
  function isWellnessStaff() { return !!(state.user && (state.user.role === 'admin' || state.user.wellnessStaff)); }
  function wlNum(v) { return Math.round(Number(v) * 10) / 10; }

  async function wlConfig() {
    if (wlCfg && wlCfg.lang === state.lang) return wlCfg;
    const d = await api('wellness.config');
    d.lang = state.lang;
    d.byId = {};
    d.questions.forEach(function (q) { d.byId[q.id] = q; });
    d.domainName = {};
    d.domains.forEach(function (x) { d.domainName[x.id] = x.name; });
    wlCfg = d;
    return d;
  }
  function wlOptLabel(qid, code) {
    const q = wlCfg && wlCfg.byId[qid];
    const o = q && q.o ? q.o.filter(function (x) { return x.c === code; })[0] : null;
    return o ? o.l : code;
  }
  function wlDom(id) { return (wlCfg && wlCfg.domainName[id]) || id; }
  function wlRoundName(id) { return (wlHomeData && wlHomeData.roundNames && wlHomeData.roundNames[id]) || id; }
  function wlDate(ms) { return ms ? fmtMs(ms, { month: 'short', day: 'numeric', year: 'numeric' }) : ''; }

  /* ---------- Small building blocks ---------- */

  /** Score bars for the 7 areas. The status is always written out, not shown by color alone. */
  function wlBars(scores) {
    return '<div class="wl-bars">' + wlCfg.domains.map(function (d) {
      const x = scores[d.id] || { score: null, status: 'INSUFFICIENT DATA' };
      const has = x.score !== null && x.score !== undefined && x.score !== '';
      const k = wlStKey(x.status);
      const val = has ? Number(x.score).toFixed(1) : '—';
      return '<div class="wl-bar-row">' +
        '<div class="wl-bar-head"><span class="wl-bar-name">' + esc(d.name) + '</span><span class="wl-bar-val">' + esc(val) + ' / 3.0</span></div>' +
        '<div class="wl-bar" role="img" aria-label="' + esc(d.name + ': ' + val + ' / 3.0, ' + wlStLabel(x.status)) + '"><span class="wl-fill st-' + k + '" style="width:' + (has ? Math.max(3, Number(x.score) / 3 * 100) : 0) + '%"></span></div>' +
        '<span class="wl-st st-' + k + '">' + esc(wlStLabel(x.status)) + '</span></div>';
    }).join('') + '</div>';
  }

  function wlTrendText(c) {
    if (c === null || c === undefined) return t('wl.trend.first');
    if (c < 0) return '↓ ' + t('wl.trend.down', { n: Math.abs(c) });
    if (c > 0) return '↑ ' + t('wl.trend.up', { n: c });
    return '→ ' + t('wl.trend.same');
  }
  function wlStatCls(c, good) {
    if (c === null || c === undefined || c === 0 || !good || good === 'none') return '';
    return (c < 0) === (good === 'down') ? ' good' : ' bad';
  }
  function wlTrendSr(cls) {
    return cls === ' good' ? '<span class="sr-only"> (' + esc(t('wl.trend.goodSr')) + ')</span>' : cls === ' bad' ? '<span class="sr-only"> (' + esc(t('wl.trend.badSr')) + ')</span>' : '';
  }
  function wlBadges(b) {
    const L = [];
    if (b.checkins >= 1) L.push(t('wl.badge.first'));
    if (b.checkins >= 5) L.push(t('wl.badge.n', { n: 5 }));
    if (b.checkins >= 10) L.push(t('wl.badge.n', { n: 10 }));
    if (b.trackingDays >= 30) L.push(t('wl.badge.days', { n: 30 }));
    if (b.trackingDays >= 90) L.push(t('wl.badge.days', { n: 90 }));
    return L.length ? '<p class="wl-badges">' + L.map(function (x) { return '<span class="chip chip-accent">🏅 ' + esc(x) + '</span>'; }).join(' ') + '</p>' : '';
  }
  const WL_LEGEND = function () { return '<p class="muted small">' + esc(t('wl.legend')) + '</p>'; };

  function wlStatsCard(b, withBtn) {
    if (!b) return '';
    const tiles = b.defs.map(function (d) {
      const s = b.stats[d.id];
      const name = t('wl.body.' + d.id);
      if (!s) {
        return '<div class="wl-stat"><span class="wl-stat-k">' + esc(name) + '</span><b>—</b><small>' +
          esc(d.id === 'BMI' ? (b.height ? t('wl.bmiNeedsWeight') : t('wl.bmiNeedsHeight')) : t('wl.notYet')) + '</small></div>';
      }
      const cls = wlStatCls(s.changePct, d.good);
      return '<div class="wl-stat' + cls + '"><span class="wl-stat-k">' + esc(name) + '</span><b>' + esc(wlNum(s.latest)) + ' <em>' + esc(d.unit) + '</em></b>' +
        '<span class="wl-trend">' + esc(wlTrendText(s.changePct)) + wlTrendSr(cls) + '</span>' +
        '<small>' + (s.previous !== null ? esc(t('wl.prev', { v: wlNum(s.previous) + ' ' + d.unit })) + ' · ' : '') + esc(s.count === 1 ? t('wl.entries1') : t('wl.entriesN', { n: s.count })) + '</small></div>';
    }).join('');
    return '<section class="card"><div class="card-head"><span class="card-icon">📏</span><h2>' + esc(t('wl.myStats')) + '</h2>' +
      (withBtn ? '<button type="button" class="btn btn-soft btn-sm wl-head-btn" data-go="wellnessBody">' + esc(t('wl.logView')) + '</button>' : '') + '</div>' +
      '<div class="wl-stats">' + tiles + '</div>' + wlBadges(b) + WL_LEGEND() +
      '<p class="muted small">' + esc(t('wl.weightNote')) + '</p></section>';
  }

  function wlLabCards(L) {
    if (!L) return '';
    const items = L.items || [];
    const head = '<div class="card-head"><span class="card-icon">🧪</span><h2>' + esc(t('wl.priorityLabs')) + '</h2>' +
      '<button type="button" class="btn btn-soft btn-sm wl-head-btn" data-go="wellnessLabs">' + esc(items.length ? t('wl.logChoose') : t('wl.chooseLabs')) + '</button></div>';
    if (!items.length) return '<section class="card">' + head + '<p class="muted">' + esc(t('wl.noLabsChosen')) + '</p></section>';
    const tiles = items.map(function (x) {
      if (x.empty) return '<div class="wl-stat"><span class="wl-stat-k">' + esc(x.name) + '</span><b>—</b><small>' + esc(t('wl.notYet')) + '</small></div>';
      const cls = wlStatCls(x.changePct, x.good);
      return '<div class="wl-stat' + cls + '"><span class="wl-stat-k">' + esc(x.name) + '</span><b>' + esc(x.latest) + ' <em>' + esc(x.unit) + '</em></b>' +
        '<span class="wl-trend">' + esc(wlTrendText(x.changePct)) + wlTrendSr(cls) + '</span>' +
        '<small>' + wlRangeChip(x.status) + ' · ' + esc(x.count === 1 ? t('wl.results1') : t('wl.resultsN', { n: x.count })) + '</small></div>';
    }).join('');
    return '<section class="card">' + head + '<div class="wl-stats">' + tiles + '</div>' + WL_LEGEND() +
      '<p class="muted small">' + esc(L.custom ? t('wl.labsCustom') : t('wl.labsDefault')) + ' ' + esc(t('wl.notDiagnosis')) + '</p></section>';
  }
  function wlRangeChip(st) {
    return '<span class="wl-range r-' + esc(st) + '">' + (st === 'within' ? '✓ ' : '! ') + esc(t('wl.range.' + st)) + '</span>';
  }

  /** Trend chart (SVG). Shaded band = normal range. Each dot has a tooltip; the table below lists every value. */
  function wlChart(name, unit, low, high, pts) {
    const W = 320, H = 150, P = 30;
    const vals = pts.map(function (p) { return p.value; }).concat([low, high].filter(function (x) { return x !== null && x !== undefined; }));
    let mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    const pad = (mx - mn || 1) * 0.2; mn -= pad; mx += pad;
    const ts = pts.map(function (p) { return Date.parse(p.date + 'T00:00:00Z'); });
    const t0 = Math.min.apply(null, ts), t1 = Math.max.apply(null, ts);
    const X = function (i) { return pts.length < 2 || t1 === t0 ? W / 2 : P + (ts[i] - t0) / (t1 - t0) * (W - 2 * P); };
    const Y = function (v) { return H - P - (v - mn) / (mx - mn) * (H - 2 * P); };
    const hi = high !== null && high !== undefined ? high : mx, lo = low !== null && low !== undefined ? low : mn;
    const line = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.value).toFixed(1); }).join(' ');
    const band = (low !== null && low !== undefined) || (high !== null && high !== undefined)
      ? '<rect class="wl-band" x="' + P + '" y="' + Y(hi).toFixed(1) + '" width="' + (W - 2 * P) + '" height="' + Math.max(0, Y(lo) - Y(hi)).toFixed(1) + '"/>' : '';
    const dots = pts.map(function (p, i) {
      return '<circle class="wl-dot d-' + esc(p.status || 'none') + '" cx="' + X(i).toFixed(1) + '" cy="' + Y(p.value).toFixed(1) + '" r="5.5"><title>' +
        esc(fmtKey(p.date, { month: 'short', day: 'numeric', year: 'numeric' }) + ': ' + p.value + ' ' + unit + (p.status && p.status !== 'none' ? ' (' + t('wl.range.' + p.status) + ')' : '')) + '</title></circle>';
    }).join('');
    const lbl = function (v, y) { return '<text class="wl-ax" x="2" y="' + (y + 3).toFixed(1) + '">' + esc(v) + '</text>'; };
    return '<svg class="wl-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('wl.chartAria', { name: name, n: pts.length })) + '">' + band +
      (high !== null && high !== undefined ? lbl(high, Y(hi)) : '') + (low !== null && low !== undefined ? lbl(low, Y(lo)) : '') +
      (pts.length > 1 ? '<path class="wl-line" d="' + line + '"/>' : '') + dots +
      '<text class="wl-ax" x="' + P + '" y="' + (H - 8) + '">' + esc(fmtKey(pts[0].date, { month: 'short', day: 'numeric' })) + '</text>' +
      (pts.length > 1 ? '<text class="wl-ax" x="' + (W - P) + '" y="' + (H - 8) + '" text-anchor="end">' + esc(fmtKey(pts[pts.length - 1].date, { month: 'short', day: 'numeric' })) + '</text>' : '') +
      '</svg>';
  }
  function wlRangeText(low, high, unit) {
    if (low !== null && high !== null) return t('wl.rangeBoth', { low: low, high: high, unit: unit });
    if (high !== null) return t('wl.rangeHigh', { high: high, unit: unit });
    if (low !== null) return t('wl.rangeLow', { low: low, unit: unit });
    return t('wl.rangeNone');
  }

  /* ---------- My wellness ---------- */
  function viewWellness() {
    return wlTabs('mine') + pageHead(t('wl.title'), t('wl.sub')) + '<div id="view-body">' + skelCards(3) + '</div>';
  }
  async function afterWellness() {
    const d = await load(getWellnessHome);

  function renderWellness() {

    if (d.canClaim && store.get('lh_wl_noclaim') !== '1') {

        '<p class="center" style="margin:8px 0 0"><button type="button" class="linklike small" data-action="wlNoClaim">' + esc(t('wl.claim.notMe')) + '</button></p></section>';
    }
    if (d.round && d.round.open && d.status !== 'submitted') {
      html += '<section class="card wl-cta"><div class="empty-emoji" aria-hidden="true">🌿</div><h2>' + esc(d.status === 'draft' ? t('wl.cta.continue') : t('wl.cta.start')) + '</h2>' +
        '<p class="muted">' + esc(t('wl.cta.sub')) + '</p><p class="small muted">' + esc(t('wl.cta.round', { name: d.round.name })) + ' · ⏱ ' + esc(t('wl.cta.time')) + '</p>' +
        '<button type="button" class="btn btn-accent btn-block btn-lg" data-go="wellnessCheck">' + esc(d.status === 'draft' ? t('wl.cta.continueBtn') : t('wl.cta.startBtn')) + '</button></section>';
    } else if (d.round && d.status === 'submitted') {
      html += '<p class="chip" style="margin-bottom:12px">✔ ' + esc(t('wl.doneRound', { name: d.round.name })) + '</p>';
    }
    if (d.followup) html += '<section class="card soft-note"><p>💛 ' + esc(t('wl.followupNote')) + '</p></section>';
    if (FEATURES.healthHistory !== false) {
      const started = hhHasData();
      html += '<section class="card"><div class="card-head"><span class="card-icon">🩺</span><h2>' + esc(t('wl.hh.title')) + '</h2></div>' +
        '<p class="small">' + esc(t('wl.hh.sub')) + '</p><p class="muted small">🔒 ' + esc(t('wl.hh.private')) + '</p>' +
        '<button type="button" class="btn btn-soft btn-block" data-go="healthHistory">' + esc(started ? t('wl.hh.continue') : t('wl.hh.open')) + '</button></section>';
    }
    html += wlStatsCard(d.body, true) + wlLabCards(d.labs);

    html += '<p class="muted small">' + esc(t('wl.disclaimer')) + '</p>';
    body.innerHTML = '<div class="stack">' + html + '</div>';
  }

  function wlRanked(scores) {
    return wlCfg.domains.filter(function (d) { const s = scores[d.id]; return s && s.score !== null && s.score !== '' && s.score !== undefined; })
      .sort(function (a, b) { return scores[b.id].score - scores[a.id].score; });
  }
  function wlDetailsHtml(a, withExtras) {
    const rk = wlRanked(a.scores);
    const dl = function (k, v) { return '<h3 class="wl-h3">' + esc(t(k)) + '</h3><p>' + v + '</p>'; };
    return '<section class="card wl-details">' +
      (withExtras ? '' : dl('wl.strengths', esc(rk.slice(0, 2).map(function (d) { return d.name; }).join(' · ') || '—')) +
        dl('wl.workOn', esc(rk.slice(-2).reverse().map(function (d) { return d.name; }).join(' · ') || '—'))) +
      dl('wl.priority', esc(wlDom(a.priority) || '—')) +
      dl('wl.readiness', esc(a.readiness ? a.readiness + '/10' : '—')) +
      (withExtras ? dl('wl.barriers', esc(a.barriers.map(function (c) { return wlOptLabel('Q41', c); }).join(' · ') || '—')) +
        dl('wl.support', esc(a.support.map(function (c) { return wlOptLabel('Q42', c); }).join(' · ') || '—')) : '') +
      '<h3 class="wl-h3">' + esc(t('wl.goals')) + '</h3>' + (a.goals.length ? '<ol class="wl-goals">' + a.goals.map(function (g) { return '<li>' + esc(g) + '</li>'; }).join('') + '</ol>' : '<p>—</p>') +
      dl('wl.firstStep', esc(a.weeklyAction || '—')) +
      dl('wl.vision', esc(a.vision || '—')) +
      '<button type="button" class="btn btn-ghost" data-action="wlPrint">🖨️ ' + esc(t('wl.print')) + '</button></section>';
  }
  function wlProfileHtml(h) {
    const cur = h[h.length - 1];
    let prev = null;
    if (h.length > 1) prev = h.slice(0, -1).filter(function (x) { return x.id === wlCmp; })[0] || h[h.length - 2];
    let html = '<h2 class="section-title">' + esc(t('wl.profile')) + '</h2>' +
      '<p class="muted small">' + esc(t('wl.completed', { date: wlDate(cur.submittedMs), round: wlRoundName(cur.roundId) })) + '</p>' +
      '<section class="card">' + wlBars(cur.scores) + '<p class="muted small">' + esc(t('wl.scaleNote')) + '</p></section>';
    if (prev) {
      html += '<section class="card"><h2 class="wl-h2">' + esc(t('wl.compare')) + '</h2>' +
        '<div class="field"><label for="wl-cmp">' + esc(t('wl.compareWith')) + '</label><select class="input" id="wl-cmp" data-wl-cmp>' +
        h.slice(0, -1).map(function (x, i) {
          return '<option value="' + esc(x.id) + '"' + (x.id === prev.id ? ' selected' : '') + '>' + esc(wlRoundName(x.roundId) + ' (' + wlDate(x.submittedMs) + ')') + '</option>';
        }).join('') + '</select></div>' +
        '<div class="table-wrap"><table class="wl-table"><thead><tr><th scope="col">' + esc(t('wl.area')) + '</th><th scope="col">' + esc(t('wl.earlier')) + '</th><th scope="col">' + esc(t('wl.now')) + '</th><th scope="col">' + esc(t('wl.change')) + '</th></tr></thead><tbody>' +
        wlCfg.domains.map(function (d) {
          const a = prev.scores[d.id], b = cur.scores[d.id];
          if (!a || !b || a.score === null || b.score === null || a.score === '' || b.score === '') return '';
          const c = Math.round((b.score - a.score) * 10) / 10;
          return '<tr><td>' + esc(d.name) + '</td><td>' + Number(a.score).toFixed(1) + '</td><td>' + Number(b.score).toFixed(1) + '</td><td>' +
            esc(c > 0 ? '↑ ' + t('wl.better', { n: c.toFixed(1) }) : c < 0 ? '↓ ' + t('wl.lower', { n: Math.abs(c).toFixed(1) }) : '→ ' + t('wl.same')) + '</td></tr>';
        }).join('') + '</tbody></table></div></section>';
    }
    html += wlDetailsHtml(cur, false);
    html += '<section class="card"><h2 class="wl-h2">' + esc(t('wl.history')) + '</h2><p class="muted small">' + esc(t('wl.historySub')) + '</p><div class="list">' +
      h.map(function (x, i) {
        return '<button type="button" class="list-link" data-go="wellnessView" data-id="' + esc(x.id) + '"><span class="ll-text"><span class="ll-title">' +
          esc(wlRoundName(x.roundId)) + '</span><span class="ll-sub">' + esc(wlDate(x.submittedMs)) + '</span></span>' +
          '<span class="chev">' + icon('chevron', 'icon-sm') + '</span></button>';
      }).join('') + '</div></section>';
    return html;
  }

  /* ---------- Wellness check (the assessment) ---------- */

  }
  async function afterWellnessCheck() {
    const r = await load(function () { return Promise.all([wlConfig(), api('wellness.start')]).then(function (x) { return x[1]; }); });
    if (!r) return;
    const dr = r.draft || {};
    wlW = { id: r.assessmentId, answers: dr.answers || {}, goals: (dr.goals || ['', '', '']).concat(['', '', '']).slice(0, 3), weekly: dr.weeklyAction || '',
      vision: dr.vision || '', consent: !!dr.consent, step: Math.min(Number(dr.step) || 0, 11), err: false, phase: 'q', missing: [] };

  function wlSecQs(n) { return wlCfg.questions.filter(function (q) { return q.sec === n; }); }
  function wlMissing1(q) {

  }
  function wlMissingIn(step) {
    if (step === 10) {
      const m = [];

      if (!String(wlW.weekly || '').trim()) m.push('WEEKLY');

    return wlSecQs(step + 1).filter(wlMissing1).map(function (q) { return q.id; });

      const arr = Array.isArray(v) ? v : [];
      input = '<p class="muted small">' + esc(t('wl.chooseUpTo', { n: q.max })) + '</p><div class="opts" role="group" aria-label="' + esc(q.t) + '">' + q.o.map(function (o) {

  function renderWlCheck() {

      }).join('') + '</select></div>' +
      '<div class="wl-kpis four">' +
        '<div><b>' + d.done + '</b><span>' + esc(t('wl.team.done')) + '</span></div>' +
        '<div><b>' + d.started + '</b><span>' + esc(t('wl.team.started')) + '</span></div>' +
        '<button type="button" class="wl-kpi-link" data-go="wellnessFlags"><b>' + d.openFlags + '</b><span>' + esc(t('wl.team.openFlags')) + ' →</span></button>' +
        '<div><b>' + d.activeWeek + '</b><span>' + esc(t('wl.dash.activeWeek')) + '</span></div>' +
      '</div>';
    if (!d.small) {
      html += (d.topNeed && d.topNeed.pct ? '<p>' + esc(t('wl.team.topNeed', { area: wlDom(d.topNeed.id), pct: d.topNeed.pct })) + '</p>' : '') +
        (d.barriers[0] ? '<p>' + esc(t('wl.team.topBarrier', { barrier: wlOptLabel('Q41', d.barriers[0].code), support: d.support[0] ? wlOptLabel('Q42', d.support[0].code) : '—' })) + '</p>' : '');
    }
    if (isCur && d.roundOpen && d.started) {
      const recent = d.remindedMs && Date.now() - d.remindedMs < 20 * 3600000;
      html += '<div class="wl-remind"><p class="small">' + esc(t('wl.dash.remindAsk', { n: d.started })) + '</p>' +
        (recent ? '<p class="muted small">✔ ' + esc(t('wl.dash.remindSent', { date: fmtMs(d.remindedMs, { month: 'short', day: 'numeric', hour: 'numeric' }) })) + '</p>'
          : '<button type="button" class="btn btn-soft btn-block" data-action="wlRemind">💌 ' + esc(t('wl.dash.remindBtn')) + '</button>') + '</div>';
    }
    html += '</section>';

    // 1. The assessment results for this round (what shapes the programs).
    html += '<section class="card"><h2 class="wl-h2">' + esc(t('wl.team.profile')) + '</h2>';
    if (d.small) {
      html += '<p class="muted">' + esc(d.done ? t('wl.dash.smallRound', { n: d.minGroup }) : t('wl.team.noData')) + '</p></section>';
    } else {
      html += (d.overall ? '<div class="wl-kpis two">' +
          '<div><b>' + esc(d.overall.health === null ? '—' : d.overall.health.toFixed(1)) + '<small>/10</small></b><span>' + esc(t('wl.dash.avgHealth')) + '</span></div>' +
          '<div><b>' + esc(d.overall.life === null ? '—' : d.overall.life.toFixed(1)) + '<small>/10</small></b><span>' + esc(t('wl.dash.avgLife')) + '</span></div></div>' : '') +
        '<p class="wl-legend">' + ['strong', 'okay', 'attention', 'priority'].map(function (k) { return '<span><i class="st-' + k + '"></i>' + esc(t('wl.st.' + k)) + '</span>'; }).join('') + '</p>' +
        d.domains.map(function (x) {
          const seg = function (k) { return x.pct[k] ? '<span class="st-' + k + '" style="width:' + x.pct[k] + '%"></span>' : ''; };
          return '<div class="wl-bar-row"><div class="wl-bar-head"><span class="wl-bar-name">' + esc(wlDom(x.id)) + '</span><span class="wl-bar-val">' + esc(t('wl.team.avg', { avg: x.avg === null ? '—' : x.avg.toFixed(1), median: x.median === null ? '—' : x.median.toFixed(1) })) + '</span></div>' +
            '<div class="wl-stack" role="img" aria-label="' + esc(wlDom(x.id) + ': ' + t('wl.team.pcts', { s: x.pct.strong, o: x.pct.okay, a: x.pct.attention, p: x.pct.priority })) + '">' + seg('strong') + seg('okay') + seg('attention') + seg('priority') + '</div>' +
            '<p class="muted small">' + esc(t('wl.team.pcts', { s: x.pct.strong, o: x.pct.okay, a: x.pct.attention, p: x.pct.priority })) + '</p></div>';
        }).join('') + '<p class="muted small">' + esc(t('wl.scaleNote')) + '</p></section>';
      html += '<div class="wl-grid">' +
        '<section class="card"><h2 class="wl-h2">' + esc(t('wl.dash.attention')) + '</h2><p class="muted small">' + esc(t('wl.dash.attentionSub')) + '</p>' + wlListBars(d.attention, wlDom, true) + '</section>' +
        '<section class="card"><h2 class="wl-h2">' + esc(t('wl.team.priorities')) + '</h2><p class="muted small">' + esc(t('wl.dash.prioSub')) + '</p>' + wlListBars(d.priorities.filter(function (x) { return x.count; }), wlDom, false) + '</section>' +
        '<section class="card"><h2 class="wl-h2">' + esc(t('wl.team.barriers')) + '</h2>' + wlListBars(d.barriers, function (c) { return wlOptLabel('Q41', c); }, true) + '</section>' +
        '<section class="card"><h2 class="wl-h2">' + esc(t('wl.team.support')) + '</h2>' + wlListBars(d.support, function (c) { return wlOptLabel('Q42', c); }, true) + '</section>' +
        '<section class="card"><h2 class="wl-h2">' + esc(t('wl.readiness')) + '</h2><dl class="facts">' +
          '<dt>' + esc(t('wl.team.rLow')) + '</dt><dd>' + d.readiness.low + '</dd><dt>' + esc(t('wl.team.rMod')) + '</dt><dd>' + d.readiness.moderate + '</dd>' +
          '<dt>' + esc(t('wl.team.rHigh')) + '</dt><dd>' + d.readiness.high + '</dd><dt>' + esc(t('wl.team.rVery')) + '</dt><dd>' + d.readiness.veryHigh + '</dd></dl></section>' +
        '</div>';
      // How people answered each question, grouped by area (tap an area to open it).
      html += '<section class="card"><h2 class="wl-h2">' + esc(t('wl.dash.byQ')) + '</h2><p class="muted small">' + esc(t('wl.dash.byQSub', { n: d.done })) + '</p>' +
        [2, 3, 4, 5, 6, 7, 8].map(function (sec) {
          const qs = wlCfg.questions.filter(function (q) { return q.sec === sec && q.type === 'single'; });
          return '<details class="wl-byq"><summary class="wl-summary">' + esc(wlCfg.sections[sec - 1]) + '</summary>' + qs.map(function (q) {
            const counts = d.answers[q.id] || {};
            const tot = Object.keys(counts).reduce(function (x, k) { return x + counts[k]; }, 0) || 1;
            return '<div class="wl-q"><p class="wl-q-t">' + esc(q.t) + '</p><ul class="wl-list">' + q.o.map(function (o) {
              const pct = Math.round((counts[o.c] || 0) * 100 / tot);
              return '<li><div class="wl-bar-head"><span>' + esc(o.l) + '</span><b>' + pct + '%</b></div><div class="wl-bar thin" aria-hidden="true"><span class="wl-fill st-team" style="width:' + pct + '%"></span></div></li>';
            }).join('') + '</ul></div>';
          }).join('') + '</details>';
        }).join('') + '</section>';
    }

    // 2. Is the group improving? (earlier round vs this one)
    if (d.beforeAfter) {
      html += '<section class="card"><h2 class="wl-h2">' + esc(t('wl.dash.baTitle')) + '</h2><p class="muted small">' + esc(t('wl.dash.baSub')) + '</p>' +
        (d.beforeAfter.ok ? wlBeforeAfter(d.beforeAfter) : '<p class="muted">' + esc(t('wl.dash.baWait', { n: d.minGroup })) + '</p>') + '</section>';
    }

    // 3. Activity
    html += '<section class="card"><h2 class="wl-h2">' + esc(t('wl.dash.activity')) + '</h2><p class="muted small">' + esc(t('wl.dash.activitySub')) + '</p>' + wlActivityChart(d.activity) + '</section>';

    // Tools
    html += '<div class="list wl-team-links">' +
      '<button type="button" class="list-link" data-go="wellnessFlags"><span class="card-icon">💛</span><span class="ll-text"><span class="ll-title">' + esc(t('wl.flags.title')) + '</span><span class="ll-sub">' + esc(t('wl.flags.linkSub', { n: d.openFlags })) + '</span></span><span class="chev">' + icon('chevron', 'icon-sm') + '</span></button>' +
      (FEATURES.healthHistory !== false ? '<button type="button" class="list-link" data-go="healthHistoryTotals"><span class="card-icon">🩺</span><span class="ll-text"><span class="ll-title">' + esc(t('wl.hh.totals')) + '</span><span class="ll-sub">' + esc(t('wl.hh.totalsSub')) + '</span></span><span class="chev">' + icon('chevron', 'icon-sm') + '</span></button>' : '') +
      '<button type="button" class="list-link" data-go="wellnessLabRanges"><span class="card-icon">🧪</span><span class="ll-text"><span class="ll-title">' + esc(t('wl.ranges.title')) + '</span><span class="ll-sub">' + esc(t('wl.ranges.linkSub')) + '</span></span><span class="chev">' + icon('chevron', 'icon-sm') + '</span></button>' +
      (d.isAdmin ? '<button type="button" class="list-link" data-go="wellnessAdmin"><span class="card-icon">👥</span><span class="ll-text"><span class="ll-title">' + esc(t('wl.admin.title')) + '</span><span class="ll-sub">' + esc(t('wl.admin.linkSub')) + '</span></span><span class="chev">' + icon('chevron', 'icon-sm') + '</span></button>' : '') +
      '</div>';
    html += '<section class="card"><h2 class="wl-h2">' + esc(t('wl.rounds.title')) + '</h2>' +
      '<p>' + esc(t('wl.rounds.this', { name: round.name })) + ' <span class="chip' + (round.status === 'open' ? ' chip-accent' : '') + '">' + esc(round.status === 'open' ? t('wl.rounds.open') : t('wl.rounds.closedChip')) + '</span></p>' +
      '<div class="row">' + (round.status === 'open'
        ? '<button type="button" class="btn btn-ghost" data-action="wlRoundSet" data-id="' + esc(round.id) + '" data-open="0">' + esc(t('wl.rounds.close')) + '</button>'
        : '<button type="button" class="btn btn-ghost" data-action="wlRoundSet" data-id="' + esc(round.id) + '" data-open="1">' + esc(t('wl.rounds.reopen')) + '</button>') + '</div>' +
      '<details class="pl-edit"><summary class="linklike small">＋ ' + esc(t('wl.rounds.new')) + '</summary>' +
      '<form data-form="wlRound" novalidate style="margin-top:10px"><p class="muted small">' + esc(t('wl.rounds.newHelp')) + '</p>' +
      '<div class="field"><label for="wl-rn">' + esc(t('wl.rounds.name')) + '</label><input class="input" id="wl-rn" name="name" maxlength="80" placeholder="' + esc(t('wl.rounds.namePh')) + '"></div>' +
      '<button type="submit" class="btn btn-soft btn-block">' + esc(t('wl.rounds.create')) + '</button></form></details></section>';
    html += '<section class="card"><h2 class="wl-h2">' + esc(t('wl.export.title')) + '</h2><div class="row">' +
      '<button type="button" class="btn btn-soft" data-action="wlExport" data-kind="summary">⬇️ ' + esc(t('wl.export.summary')) + '</button>' +
      (d.isAdmin ? '<button type="button" class="btn btn-soft" data-action="wlExport" data-kind="assessments">⬇️ ' + esc(t('wl.export.all')) + '</button>' : '') +
      '</div>' + (d.isAdmin ? '<p class="muted small">' + esc(t('wl.export.allNote')) + '</p>' : '') + '</section>';
    html += wlPrivacyNote(d);
    body.innerHTML = '<div class="stack">' + html + '</div>';
  }

  /* ---------- Forms & actions ---------- */
  const WL_FORMS = {
    wlLab: function (form) {
      const d = formData(form);
      if (!String(d.value || '').trim()) return showFormMessage(form, t('wl.err.number'));
      return withBusy(form, t('busy.saving'), async function () {
        wlLabsData = await api('wellness.labAdd', d);
        invalidate('home');
        toast(t('wl.saved'));
        renderWellnessLabs();
      });
    },
    wlBody: function (form) {
      const d = formData(form);
      return withBusy(form, t('busy.saving'), async function () {
        wlBodyData = await api('wellness.bodyAdd', { date: d.date, values: { WEIGHT: d.WEIGHT, HEIGHT: d.HEIGHT, WAIST: d.WAIST, NECK: d.NECK } });
        invalidate('home');
        toast(t('wl.saved'));
        renderWellnessBody();
      });
    },
    wlClaim: function (form) {
      const d = formData(form);
      if (!String(d.name || '').trim() || !String(d.pin || '').trim()) return showFormMessage(form, t('wl.claim.fill'));
      return withBusy(form, t('busy.saving'), async function () {
        const res = await api('wellness.claim', { name: d.name, pin: d.pin });
        wlHomeData = null;
        toast(t('wl.claim.done', { n: res.rows }), 5000);
        go('wellness');
      });
    },
    wlRound: function (form) {
      const d = formData(form);
      if (!String(d.name || '').trim()) return showFormMessage(form, t('wl.err.roundName'));
      return withBusy(form, t('busy.saving'), async function () {
        wlTeamData = await api('wellness.roundNew', { name: d.name });
        toast(t('wl.rounds.created'));
        go('wellnessTeam', {}, true);
      });
    },
    wlResolve: function (form) {
      const d = formData(form);
      return withBusy(form, t('busy.saving'), async function () {
        wlFlagsData = await api('wellness.flagResolve', { id: d.id, note: d.note });
        toast(t('wl.flags.doneToast'));
        renderWellnessFlags();
      });
    },
    wlLabRange: function (form) {
      const d = formData(form);
      return withBusy(form, t('busy.saving'), async function () {
        await api('wellness.labSave', { id: d.id, low: d.low, high: d.high, isDefault: d.isDefault === true });
        showFormMessage(form, t('wl.saved'), 'success');
      });
    },

    wlPick: function (el) {
      if (!wlW) return;
      const q = el.getAttribute('data-q');
      wlW.answers[q] = el.getAttribute('data-v');
      el.parentNode.querySelectorAll('[role="radio"]').forEach(function (b) { b.setAttribute('aria-checked', String(b === el)); });
      const card = el.closest('.wl-missing');
      if (card) { card.classList.remove('wl-missing'); const m = card.querySelector('.wl-miss-msg'); if (m) m.remove(); }
    },
    wlToggle: function (el) {
      if (!wlW) return;
      const qid = el.getAttribute('data-q'), c = el.getAttribute('data-v');
      const q = wlCfg.byId[qid];
      const arr = Array.isArray(wlW.answers[qid]) ? wlW.answers[qid].slice() : [];
      const i = arr.indexOf(c);
      if (i === -1) {
        if (arr.length >= q.max) { toast(t('wl.chooseUpTo', { n: q.max })); return; }
        arr.push(c);
      } else arr.splice(i, 1);
      wlW.answers[qid] = arr;
      const on = arr.indexOf(c) !== -1;
      el.setAttribute('aria-pressed', String(on));
      el.querySelector('.opt-box').textContent = on ? '✓' : '';
      const card = el.closest('.wl-missing');
      if (card && arr.length) { card.classList.remove('wl-missing'); const m = card.querySelector('.wl-miss-msg'); if (m) m.remove(); }

    wlNext: async function (el) {
      if (!wlW) return;
      el.disabled = true;
      const missing = wlMissingIn(wlW.step);
      if (missing.length) {
        wlW.err = true;
        await wlSave();
        renderWlCheck();
        return;
      }
      wlW.err = false;
      wlW.step++;
      await wlSave();
      renderWlCheck();

    wlPrev: async function () {
      if (!wlW) return;

      if (wlW.step >= 11) { const c = document.getElementById('wl-consent'); if (c) wlW.consent = c.checked; }

      const c = document.getElementById('wl-consent');

      if (!wlW.consent) { if (box) box.innerHTML = '<div class="form-error" role="alert">' + esc(t('wl.consentReq')) + '</div>'; return; }
      el.disabled = true;
      el.textContent = t('busy.saving');
      try {
        const res = await api('wellness.submit', wlPayload());
        if (!res.ok) {
          // Jump back to the first section with something missing.
          let step = 10;
          for (let s = 0; s < 11; s++) { if (wlMissingIn(s).length) { step = s; break; } }
          wlW.step = step;
          wlW.err = true;
          renderWlCheck();
          return;
        }
        wlW.phase = 'done';
        wlHomeData = null;
        invalidate('home');
        renderWlCheck();

  function hhAge(d) {

  function hhScores(d) {

      s.bmiCat = s.bmi < 18.5 ? 'under' : s.bmi < 23 ? 'normal' : s.bmi < 25 ? 'over' : 'obese';
    }
    const wc = Number(d.waist);
    if (wc > 0 && d.sex) s.waistRisk = d.sex === 'female' ? wc > 80 : wc > 90;
    if (d.audit1 !== undefined) {
      s.auditc = d.audit1 === '0' ? 0 : Number(d.audit1) + Number(d.audit2 || 0) + Number(d.audit3 || 0);
      s.auditHigh = s.auditc >= (d.sex === 'male' ? 4 : 3);

    if (d.phqA !== undefined && d.phqB !== undefined) { s.phq2 = Number(d.phqA) + Number(d.phqB); s.phqHigh = s.phq2 >= 3; }
    if (d.pavsDays !== undefined && d.pavsMin !== undefined) {

  const band = function (v, cuts, names) { for (let i = 0; i < cuts.length; i++) if (v <= cuts[i]) return names[i]; return names[names.length - 1]; };

  /* ---------- Locked backup (scrambled on the phone) ---------- */
  function hhCryptoOk() { return !!(window.crypto && crypto.subtle && window.TextEncoder); }
  function hhB64(buf) { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
  function hhUnB64(s) { const bin = atob(s); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; }
  async function hhKey(pw, salt) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function hhEncrypt(obj, pw) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await hhKey(pw, salt);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
    return 'v1.' + hhB64(salt) + '.' + hhB64(iv) + '.' + hhB64(ct);
  }
  async function hhDecrypt(blob, pw) {
    const p = String(blob).split('.');
    if (p.length !== 4 || p[0] !== 'v1') throw new Error('bad');
    const key = await hhKey(pw, hhUnB64(p[1]));
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: hhUnB64(p[2]) }, key, hhUnB64(p[3]));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function hhBackupNow(quiet) {
    if (!hhPw || !hhCryptoOk()) return false;
    try {
      const blob = await hhEncrypt({ data: HHS.data, updatedAt: HHS.updatedAt }, hhPw);
      await api('hh.backupSave', { blob: blob });
      hhStatusData = hhStatusData || {};
      hhStatusData.backup = { updatedMs: Date.now(), size: blob.length };
      if (!quiet) toast('Locked backup saved 🔒');
      return true;
    } catch (e) { if (!quiet) toast(e.message || 'The backup could not be saved.', 5000); return false; }
  }

  /* ---------- Typing in the form ---------- */
  function hhInput(el) {
    if (!HHS) return false;
    const d = HHS.data;
    if (el.hasAttribute('data-hh')) {
      const k = el.getAttribute('data-hh');
      d[k] = el.value;
      hhSaveLocal();
      // Questions that show or hide others.
      if (el.type === 'radio' && HH_SECTIONS.some(function (s) { return s.fields.some(function (f) { return f.showIf && f.showIf[0] === k; }); })) renderHealthHistoryEdit(true);
      return true;
    }
    if (el.hasAttribute('data-hh-multi')) {
      const k = el.getAttribute('data-hh-multi');
      const arr = Array.isArray(d[k]) ? d[k].slice() : [];
      const i = arr.indexOf(el.value);
      if (el.checked && i === -1) arr.push(el.value);
      if (!el.checked && i !== -1) arr.splice(i, 1);
      d[k] = arr;
      hhSaveLocal();
      if (k === 'cond' || el.value === 'other') renderHealthHistoryEdit(true);
      return true;
    }
    if (el.hasAttribute('data-hh-bool')) { d[el.getAttribute('data-hh-bool')] = el.checked; if (el.checked && !d.signDate) d.signDate = todayKey(); hhSaveLocal(); return true; }
    if (el.hasAttribute('data-hh-row')) {
      const k = el.getAttribute('data-hh-row'), i = Number(el.getAttribute('data-i')), f = el.getAttribute('data-f');
      const rows = Array.isArray(d[k]) && d[k].length ? d[k] : [{}];
      rows[i] = rows[i] || {};
      rows[i][f] = el.value;
      d[k] = rows;
      hhSaveLocal();
      return true;
    }
    return false;
  }

  const HH_FORMS = {

        if (await hhBackupNow(true)) { toast('Locked backup is on 🔒 Please remember your password.', 6000); renderHealthHistory(); }
        else { hhPw = ''; showFormMessage(form, 'The backup could not be saved. Please try again.'); }
      });
    },
    hhUnlockPw: function (form) {
      const d = formData(form);
      return withBusy(form, 'Checking…', async function () {
        const r = await api('hh.backupGet');
        try { await hhDecrypt(r.blob, d.pw); } catch (e) { showFormMessage(form, "That password doesn't match your backup."); return; }
        hhPw = d.pw;
        await hhBackupNow(false);
        renderHealthHistory();
      });
    },
    hhRestore: function (form) {
      const d = formData(form);
      return withBusy(form, 'Unlocking…', async function () {
        const r = await api('hh.backupGet');
        let got;
        try { got = await hhDecrypt(r.blob, d.pw); } catch (e) { showFormMessage(form, "That password doesn't match your backup."); return; }
        HHS.data = got.data || {};
        HHS.backupOn = true;
        hhPw = d.pw;
        hhSaveLocal();
        toast('Your answers are back on this phone 🌿', 4000);
        renderHealthHistory();
      });
    }
  };
  const HH_ACTIONS = {
    hhSeg: function (el) {
      if (!HHS) return;
      HHS.data[el.getAttribute('data-k')] = el.getAttribute('data-v');
      hhSaveLocal();
      el.parentNode.querySelectorAll('[role="radio"]').forEach(function (b) { b.setAttribute('aria-checked', String(b === el)); });
    },
    hhFood: function (el) {
      if (!HHS) return;
      HHS.data.food = HHS.data.food || {};
      HHS.data.food[el.getAttribute('data-item')] = el.getAttribute('data-v');
      hhSaveLocal();
      el.parentNode.querySelectorAll('[role="radio"]').forEach(function (b) { b.setAttribute('aria-checked', String(b === el)); });
    },
    hhAddRow: function () {
      const rows = Array.isArray(HHS.data.meds) && HHS.data.meds.length ? HHS.data.meds : [{}];
      rows.push({}); HHS.data.meds = rows; hhSaveLocal(); renderHealthHistoryEdit(true);
    },
    hhDelRow: function (el) {
      const rows = HHS.data.meds || [];
      rows.splice(Number(el.getAttribute('data-i')), 1); HHS.data.meds = rows; hhSaveLocal(); renderHealthHistoryEdit(true);
    },
    hhNext: async function (el) {
      hhSaveLocal();
      if (hhPw) hhBackupNow(true);
      const to = el.getAttribute('data-id');
      if (to === 'done') { toast('All saved on this phone 🌿 You can print it now.', 4000); go('healthHistory'); }
      else go('healthHistoryEdit', { id: to });
    },
    hhPrint: function () { window.print(); },
    hhBackupNow: async function (el) { el.disabled = true; await hhBackupNow(false); renderHealthHistory(); },
    hhBackupDelete: async function (el) {
      if (!armed(el, 'Tap again to delete the backup')) return;
      el.disabled = true;
      try { await api('hh.backupDelete'); hhStatusData.backup = null; hhPw = ''; HHS.backupOn = false; hhSaveLocal(); toast('Locked backup deleted.'); renderHealthHistory(); }
      catch (e) { el.disabled = false; toast(e.message, 4000); }
    },
    hhWipe: function (el) {
      if (!armed(el, 'Tap again to delete everything from this phone')) return;
      try { localStorage.removeItem(hhStoreKey()); } catch (e) { /* ignore */ }
      HHS = null; hhPw = '';
      toast('Your answers were deleted from this phone.', 4000);
      renderHealthHistory();
    },
    hhContribute: async function (el) {
      el.disabled = true;
      try {
        await api('hh.contribute', { summary: hhSummary(hhLoad().data) });
        hhStatusData.contributed = true;
        toast('Thank you! Your answers were added anonymously 💛', 5000);
        renderHealthHistory();
      } catch (e) { el.disabled = false; toast(e.message, 5000); }
    },
    hhReset: async function (el) {
      if (!armed(el, 'Tap again to clear the totals')) return;
      el.disabled = true;
      try { hhTotalsData = await api('hh.reset'); toast('Totals cleared.'); renderHealthHistoryTotals(); }
      catch (e) { el.disabled = false; toast(e.message, 4000); }
    }
  };

  /* ---------------- Questionnaires ---------------- */
  const FORM_EMOJI = { gifts: '✨', volunteer: '🙌', story: '💛', growing: '🌱' };
  let qState = null;

  function formStatusChip(status) {
    const cls = status === 'completed' ? 'chip' : (status === 'in_progress' ? 'chip chip-accent' : 'chip');
    return '<span class="' + cls + '">' + esc(t('q.st.' + status)) + '</span>';
  }
  function formActionLabel(status) {
    return status === 'completed' ? t('q.update') : (status === 'in_progress' ? t('q.resume') : t('q.start'));
  }

  /** Back from a questionnaire: the Serve page if it was opened from there, otherwise the More menu. */
  function qBack() {
    return state.params.view === 'serving' ? backBtn('serving', {}, t('srv.title')) : backBtn('more', {}, t('nav.more'));
  }
  function viewQ() {
    return qBack() + '<div id="view-body">' + skelCards(2) + '</div>';
  }

  async function afterQ() {
    const form = state.params.key;
    const d = await load(function () { return api('q.get', { form: form }); });
    if (!d) return;
    const byKey = {};
    d.screens.forEach(function (s) { s.forEach(function (q) { byKey[q.qkey] = q; }); });
    qState = { form: form, data: d, idx: 0, answers: Object.assign({}, d.answers), byKey: byKey, phase: 'intro', results: d.results || null };
    renderQ();
  }

  function renderQ() {
    const main = document.getElementById('main');
    if (!main || !qState) return;
    if (qState.phase === 'intro') main.innerHTML = qIntroHtml();
    else if (qState.phase === 'done') main.innerHTML = qDoneHtml();
    else main.innerHTML = qScreenHtml();
    window.scrollTo(0, 0);
    focusHeading();
  }

  function hasAnswer(v) { return v !== undefined && v !== null && v !== '' && !(Array.isArray(v) && !v.length); }

  function firstOpenScreen() {
    const screens = qState.data.screens;
    for (let i = 0; i < screens.length; i++) {
      if (screens[i].some(function (q) { return !hasAnswer(qState.answers[q.qkey]); })) return i;
    }
    return 0;
  }

  function giftResultsHtml(results) {
    if (!results || !results.top || !results.top.length) return '<p class="muted">' + esc(t('q.noResults')) + '</p>';
    return '<div class="stack">' + results.top.map(function (g, i) {
      return '<section class="card gift-card"><div class="row" style="flex-wrap:nowrap">' +
        '<span class="gift-rank" aria-hidden="true">' + (i + 1) + '</span>' +
        '<div><h3 style="margin:0 0 4px">' + esc(g.name) + '</h3>' +
        '<p style="margin:0 0 6px">' + esc(g.description) + '</p>' +
        (g.ministry ? '<p class="muted small" style="margin:0">' + esc(t('q.shine', { ministry: g.ministry })) + '</p>' : '') +
        '</div></div></section>';
    }).join('') + '</div>';
  }

  function qIntroHtml() {
    const d = qState.data, f = qState.form;
    const status = d.status;
    let html = qBack() +
      '<div class="card q-intro">' +
        '<div class="empty-emoji" aria-hidden="true">' + (FORM_EMOJI[f] || '🌱') + '</div>' +
        '<h1>' + esc(t('q.' + f + '.title')) + '</h1>' +
        '<p class="lead">' + esc(t('q.' + f + '.intro')) + '</p>' +
        '<p class="row" style="justify-content:center"><span class="chip">⏱ ' + esc(t('q.minutes', { n: d.minutes })) + '</span>' + formStatusChip(status) + '</p>' +
        '<p class="muted small">' + esc(t('q.skipNote')) + '</p>' +
        '<button type="button" class="btn btn-primary btn-block btn-lg" data-action="qBegin">' +
          esc(status === 'completed' ? t('q.update') : (status === 'in_progress' ? t('q.continue') : t('q.begin'))) + '</button>' +
      '</div>';
    if (f === 'gifts' && status === 'completed') {
      html += '<h2 class="section-title">' + esc(t('q.myGifts')) + '</h2>' + giftResultsHtml(qState.results);
    }
    return html;
  }

  function scaleHtml(q, v) {
    let btns = '';
    for (let n = 1; n <= 5; n++) {
      btns += '<button type="button" class="scale-btn" role="radio" aria-checked="' + (v === n) + '" data-action="qPick" data-q="' + esc(q.qkey) + '" data-v="' + n + '"' +
        ' aria-label="' + n + ': ' + esc(t('q.scale' + n)) + '">' + n + '</button>';
    }
    return '<div class="scale" role="radiogroup" aria-label="' + esc(q.text) + '">' + btns + '</div>' +
      '<div class="scale-ends" aria-hidden="true"><span>' + esc(t('q.scale1')) + '</span><span>' + esc(t('q.scale5')) + '</span></div>' +
      '<div class="scale-foot"><span class="scale-picked">' + (typeof v === 'number' ? esc(t('q.scale' + v)) : '') + '</span>' +
        '<button type="button" class="chip-btn small-chip" role="radio" aria-checked="' + (v === 'unsure') + '" aria-pressed="' + (v === 'unsure') + '" data-action="qPick" data-q="' + esc(q.qkey) + '" data-v="unsure">' + esc(t('q.notSure')) + '</button></div>';
  }

  function questionHtml(q) {
    const v = qState.answers[q.qkey];
    let input = '';
    if (q.type === 'scale') input = scaleHtml(q, v);
    else if (q.type === 'choice' || q.type === 'journey') {
      input = '<div class="opts" role="radiogroup" aria-label="' + esc(q.text) + '">' + q.options.map(function (o) {
        const on = v === o.value;
        return '<button type="button" class="opt-card' + (q.type === 'journey' ? ' journey' : '') + '" role="radio" aria-checked="' + on + '" data-action="qPick" data-q="' + esc(q.qkey) + '" data-v="' + esc(o.value) + '">' +
          '<span class="opt-dot" aria-hidden="true"></span><span>' + esc(o.label) + '</span></button>';
      }).join('') + '</div>';
    } else if (q.type === 'multi') {
      const arr = Array.isArray(v) ? v : [];
      input = '<div class="opts" role="group" aria-label="' + esc(q.text) + '">' + q.options.map(function (o) {
        const on = arr.indexOf(o.value) !== -1;
        return '<button type="button" class="opt-card multi" aria-pressed="' + on + '" data-action="qToggle" data-q="' + esc(q.qkey) + '" data-v="' + esc(o.value) + '">' +
          '<span class="opt-box" aria-hidden="true">' + (on ? '✓' : '') + '</span><span>' + esc(o.label) + '</span></button>';
      }).join('') + '</div>';
    } else {
      input = '<label class="sr-only" for="qt-' + esc(q.qkey) + '">' + esc(q.text) + '</label>' +
        '<textarea class="input" id="qt-' + esc(q.qkey) + '" data-qtext="' + esc(q.qkey) + '" rows="4" maxlength="2000" placeholder="' + esc(t('q.textPh')) + '">' + esc(typeof v === 'string' ? v : '') + '</textarea>';
    }
    return '<section class="card q-card' + (q.type === 'scale' ? ' q-scale' : '') + '" data-qblock="' + esc(q.qkey) + '">' +
      '<h2 class="q-text">' + esc(q.text) + '</h2>' +
      (q.help ? '<p class="muted small q-help">' + esc(q.help) + '</p>' : '') +
      input + '</section>';
  }

  function qScreenHtml() {
    const screens = qState.data.screens;
    const i = qState.idx, total = screens.length;
    const last = i === total - 1;
    return '<div class="q-top">' +
        '<p class="eyebrow" style="margin:0">' + esc(t('q.' + qState.form + '.title')) + '</p>' +
        '<h1 class="q-step">' + esc(t('q.step', { n: i + 1, total: total })) + '</h1>' +
        '<div class="q-progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + (i + 1) + '"><span style="width:' + Math.round(((i + 1) / total) * 100) + '%"></span></div>' +

      '<h1>' + esc(t('q.doneToast')) + '</h1>' +

  function rerenderQuestion(qkey) {
    const el = document.querySelector('[data-qblock="' + qkey.replace(/"/g, '') + '"]');
    const q = qState && qState.byKey[qkey];
    if (!el || !q) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = questionHtml(q);
    el.replaceWith(tmp.firstChild);
  }

  /** Answers on the current screen (empty ones sent as null so the server clears them). */
  function screenAnswers() {
    const out = {};
    qState.data.screens[qState.idx].forEach(function (q) {
      const v = qState.answers[q.qkey];
      out[q.qkey] = hasAnswer(v) ? v : null;
    });
    return out;
  }

  async function qSave(complete) {
    const res = await api('q.save', { form: qState.form, answers: screenAnswers(), complete: !!complete });
    invalidate('home');
    qState.data.status = res.status;
    if (res.results) qState.results = res.results;
    return res;
  }

        const shown = [p.showGroup && t('dir.f.group'), p.showEmail && t('dir.f.email'), p.showMobile && t('dir.f.mobile'), p.showPhoto && t('dir.f.photo')].filter(Boolean);
        dirBox.textContent = p.isListed ? t('dir.statusOn', { what: shown.join(', ') || '—' }) : t('dir.statusOff');

      const d = await api('q.mine');

  /* =======================================================
   * 14. Session handling
   * ======================================================= */
  function setPendingEmail(email) {
    state.pendingEmail = email || '';
    if (email) store.set('lh_pending_email', email); else store.del('lh_pending_email');
  }

  /**
   * After logging in: if this phone has no language choice yet, use the one
   * saved in the person's profile. If this phone has a choice that differs,
   * save it to their profile (it's what they just picked).
   */
  function syncLanguage(user) {
    const local = validLang(store.get('lh_lang'));
    const saved = validLang(user && user.language);
    if (!local && saved) { applyLang(saved, true); return; }
    if (local && local !== saved) {
      api('profile.setLanguage', { language: local }).then(function () { if (state.user) state.user.language = local; }).catch(function () { /* not important */ });
    }
  }

  /** Remember who's signed in on this phone, so the app can open straight to Home next time. */
  function rememberUser(user) {
    if (!state.token || !user) return;
    store.set('lh_user_' + CACHE_VER, JSON.stringify({ tk: state.token.slice(-10), user: user }));
  }
  function savedUser() {
    try {
      const x = JSON.parse(store.get('lh_user_' + CACHE_VER) || 'null');
      return x && state.token && x.tk === state.token.slice(-10) && x.user && x.user.id ? x.user : null;
    } catch (e) { return null; }
  }

  function signedIn(data) {
    state.token = data.token;
    state.user = data.user;
    store.set('lh_token', data.token);
    rememberUser(data.user);
    setPendingEmail('');
    state.shellReady = false;
    dataCache = {};
    cmsData = {};
    syncLanguage(data.user);
    goStart();
  }

  function handleSignedOut(message) {
    if (!state.token && !state.user) return;
    state.token = null;
    state.user = null;
    state.shellReady = false;
    dataCache = {};
    cmsData = {};
    clearSaved();
    prefetched = false;
    store.del('lh_token');
    store.del('lh_user_' + CACHE_VER);
    if (message) toast(message, 4000);
    go('welcome', {}, true);
  }

      applyLang(lang, true);

    togglePw: function (el) {

      const show = input.type === 'password';

      go(el.getAttribute('data-back') || 'more', params);

    cmsSelectAll: function () {

      if (d) d.items.forEach(function (i) { cmsSelect.ids[i.id] = true; });

    cmsSelectPast: function () {
      const d = cmsData[state.params.key];

      if (d) d.items.forEach(function (i) { if (i.past) cmsSelect.ids[i.id] = true; });

    },

    cmsDeleteSelected: async function (el) {
      const n = selectedCount();
      if (!n) return;
      if (el.getAttribute('data-armed') !== '1') {
        el.setAttribute('data-armed', '1');
        el.textContent = t('mg.tapAgainMany', { n: n });
        setTimeout(function () {
          if (document.body.contains(el)) { el.removeAttribute('data-armed'); el.textContent = t('mg.deleteSel', { n: selectedCount() }); }
        }, 5000);
        return;
      }
      const type = state.params.key;
      el.disabled = true;
      el.textContent = t('busy.deleting');
      try {
        const res = await api('cms.deleteMany', { type: type, ids: Object.keys(cmsSelect.ids) });
        (MANAGE_REFRESH[type] || []).forEach(function (k) { invalidate(k); });
        delete cmsData[type];
        toast(res.message, 3500);
        render();
      } catch (e) {
        el.disabled = false;
        el.removeAttribute('data-armed');
        el.textContent = t('mg.deleteSel', { n: selectedCount() });
        toast(e.message, 4500);
      }
    },

    cmsDelete: async function (el) {
      if (el.getAttribute('data-armed') !== '1') {
        const original = el.textContent;
        el.setAttribute('data-armed', '1');
        el.textContent = t('mg.tapAgainOne');
        setTimeout(function () {
          if (document.body.contains(el)) { el.removeAttribute('data-armed'); el.textContent = original; }
        }, 5000);

  Object.assign(FORMS, WL_FORMS, HH_FORMS);
  Object.assign(ACTIONS, WL_ACTIONS, HH_ACTIONS);

  /* =======================================================
   * 17. Global event listeners (event delegation)
   * ======================================================= */
  document.addEventListener('click', function (e) {
    const goEl = e.target.closest('[data-go]');
    if (goEl) {
      e.preventDefault();
      const params = {};
      ['key', 'id', 'tab', 'view'].forEach(function (p) {
        const v = goEl.getAttribute('data-' + p);
        if (v) params[p] = v;
      });
      go(goEl.getAttribute('data-go'), params);
      return;
    }
    const actEl = e.target.closest('[data-action]');
    if (actEl) {
      const fn = ACTIONS[actEl.getAttribute('data-action')];
      if (fn) { e.preventDefault(); fn(actEl, e); }
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target && (e.target.type === 'radio' || e.target.type === 'checkbox') && (e.target.hasAttribute('data-hh') || e.target.hasAttribute('data-hh-multi') || e.target.hasAttribute('data-hh-bool'))) { hhInput(e.target); return; }
    if (e.target.hasAttribute && e.target.hasAttribute('data-wl-cmp')) { wlCmp = e.target.value; const y = window.scrollY; renderWellness(); window.scrollTo(0, y); return; }
    if (e.target.hasAttribute && e.target.hasAttribute('data-wl-round')) { go('wellnessTeam', { id: e.target.value }, true); return; }
    if (e.target.hasAttribute && e.target.hasAttribute('data-wl-unit')) {
      const tt = wlLabsData && wlLabsData.tests.filter(function (x) { return x.id === e.target.value; })[0];
      const u = document.getElementById('wl-lu'); if (u && tt) u.textContent = '(' + tt.unit + ')';
      return;
    }
    if (e.target.hasAttribute && e.target.hasAttribute('data-ft-key')) { saveFeatureSwitch(e.target); return; }
    if (e.target.hasAttribute && e.target.hasAttribute('data-hs-key') && homeDraft) {
      const c = homeDraft.find(function (x) { return x.key === e.target.getAttribute('data-hs-key'); });
      if (c) { c.on = e.target.checked; rerenderHomePrefs(); }
      return;
    }
    if (e.target.hasAttribute && e.target.hasAttribute('data-dir-toggle')) {
      const opts = document.getElementById('dir-opts');
      if (opts) opts.hidden = !e.target.checked;
      return;
    }
    const pf = e.target.getAttribute && e.target.getAttribute('data-people-filter');
    if (pf && pf !== 'q') { peopleFilter[pf] = e.target.value; renderPeopleList(); return; }
    if (e.target.hasAttribute && e.target.hasAttribute('data-cfg-auto')) { FORMS.cfg(e.target.closest('form')); return; }
    const colorFor = e.target.getAttribute && e.target.getAttribute('data-color-for');
    if (colorFor) { const tx = document.getElementById(colorFor); if (tx) tx.value = e.target.value.toUpperCase(); return; }
    if (e.target.hasAttribute && e.target.hasAttribute('data-qe-type')) {
      const ty = e.target.value;
      const g = document.getElementById('qe-gift'); if (g) g.hidden = ty !== 'scale';
      const o = document.getElementById('qe-options'); if (o) o.hidden = !(ty === 'choice' || ty === 'multi' || ty === 'journey');
      return;
    }
    const prForm = e.target.name === 'type' && e.target.closest && e.target.closest('form[data-form="prayer"]');
    if (prForm) { syncPrayerForm(prForm); return; }
    const box = e.target.closest && e.target.closest('[data-cms-pick]');
    if (!box) return;
    const id = box.getAttribute('data-cms-pick');
    if (box.checked) cmsSelect.ids[id] = true; else delete cmsSelect.ids[id];
    const btn = document.querySelector('.bulk-delete');
    if (btn) {
      btn.removeAttribute('data-armed');
      btn.disabled = !selectedCount();
      btn.textContent = t('mg.deleteSel', { n: selectedCount() });
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-wl-text')) { wlText(e.target); return; }
    if (e.target && e.target.hasAttribute && (e.target.hasAttribute('data-hh') || e.target.hasAttribute('data-hh-row')) && e.target.type !== 'radio' && e.target.type !== 'checkbox') { hhInput(e.target); return; }
    if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-member-search')) { runMemberSearch(e.target); return; }
    if (e.target && e.target.getAttribute && e.target.getAttribute('data-people-filter') === 'q') { peopleFilter.q = e.target.value; renderPeopleList(); return; }
    if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-cfg-search')) { cfgSearch = e.target.value; renderSettings(); return; }
    if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-dir-search')) { dirSearch = e.target.value; renderDirectory(); return; }
    const k = e.target && e.target.getAttribute && e.target.getAttribute('data-qtext');
    if (k && qState) qState.answers[k] = e.target.value;
  });

  document.addEventListener('submit', function (e) {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    const handler = FORMS[form.getAttribute('data-form')];
    if (handler) handler(form);
  });

  window.addEventListener('offline', function () { toast(t('err.offline'), 4000); });

  /* =======================================================
   * 18. Start
   * ======================================================= */
  async function startApp() {
    if (FRAMED_BY_STRANGER) {
      $app.innerHTML = '<main class="auth-wrap"><section class="card auth-card"><h1>' + esc(CFG.churchName || 'Lighthouse') + '</h1>' +
        '<p>' + esc(t('frame.blocked')) + '</p>' +
        (APP_URL ? '<a class="btn btn-primary btn-block" href="' + esc(APP_URL) + '" target="_top" rel="noopener">' + esc(t('frame.open')) + '</a>' : '') + '</section></main>';
      return;
    }
    setupHistory();
    // A link from an event email (?event=<id>) opens that event once signed in.
    if (BOOT.openEvent && !state.openEventDone) state.openEvent = String(BOOT.openEvent).slice(0, 60);
    if (BOOT.page === 'guest' && !state.pageHandled) {
      state.pageHandled = true;
      state.token = store.get('lh_token');
      go('guest', {}, true);
      if (state.token) api('session.me').then(function (d) { state.user = d.user; }).catch(function () { /* fine */ });
      return;
    }
    state.pendingEmail = store.get('lh_pending_email') || '';
    state.token = store.get('lh_token');

    if (state.token) {
      // Seen this phone before: open Home straight away and check the sign-in in the background.
      const known = savedUser();
      if (known) {
        state.user = known;
        goStart();
        api('session.me').then(function (data) {
          const changed = JSON.stringify(data.user) !== JSON.stringify(state.user);
          state.user = data.user;
          rememberUser(data.user);
          syncLanguage(data.user);
          if (changed) { state.shellReady = false; render(); }   // role, menu or name changed elsewhere
        }).catch(function (err) {
          // AUTH: handleSignedOut already showed the welcome page. Network trouble: keep going.
        });
        return;
      }
      $app.innerHTML = viewSkeleton();
      try {
        const data = await api('session.me');
        state.user = data.user;
        rememberUser(data.user);
        syncLanguage(data.user);
        goStart();
        return;
      } catch (err) {
        if (err.code === 'AUTH') return; // handleSignedOut already showed the welcome page
        $app.innerHTML = viewBootError(err.message);
        return;
      }
    }
    go('welcome', {}, true);
  }

  /** First screen after signing in: an event from an email link, else Home. */
  function goStart() {
    if (state.openEvent && FEATURES.events !== false) {
      const id = state.openEvent;
      state.openEvent = null;
      state.openEventDone = true;
      return go('event', { id: id }, true);
    }
    go('home', {}, true);
  }

  async function boot() {
    await ensureLang(state.lang);
    applyLang(state.lang, false);
    applyTheme();
    // The in-app browser check runs BEFORE anything else.
    const inApp = CFG.blockInAppBrowsers !== false && !store.get('lh_skip_blocker') ? detectInAppBrowser() : null;
    if (inApp) { state.blockerApp = inApp; renderBlocker(); return; }
    startApp();
  }

  boot();
};

  <!-- Start-up: get the app's settings from Google, then start the app -->
  <script>
  (function () {
    var API = String(window.LIGHTHOUSE_APP_URL || '').trim().replace(/[?#].*$/, '');
    var BOOT_KEY = 'lh_boot_v1';
    var splash = document.getElementById('lh-splash');
    var app = document.getElementById('app');
    var qs = new URLSearchParams(location.search);
    var started = false;

    function hideSplash() { splash.classList.add('hide'); setTimeout(function () { splash.remove(); }, 400); }
    function notice(title, text, retry) {
      splash.remove();
      app.innerHTML = '<div class="lh-notice"><img src="icons/icon-192.png" alt=""><h2></h2><p></p>' + (retry ? '<button type="button">Try again</button>' : '') + '</div>';
      app.querySelector('h2').textContent = title;
      app.querySelector('p').textContent = text;
      if (retry) app.querySelector('button').onclick = function () { location.reload(); };
    }
    if (!/^https:\/\/script\.google\.com\/(a\/macros\/[^\/\s]+|macros)\/s\/[\w-]+\/exec$/.test(API) && !/^http:\/\/localhost(:\d+)?\//.test(API)) {
      notice('Check the app link', 'The Apps Script link near the top of index.html should start with https://script.google.com/ and end with /exec.');
      return;
    }
    function start(boot) {
      if (started) return;
      started = true;
      boot.apiUrl = API;
      boot.page = String(qs.get('page') || '').slice(0, 30);
      boot.openEvent = String(qs.get('event') || '').replace(/[^\w-]/g, '').slice(0, 60);
      boot.inShell = false;
      window.__LH_BOOT__ = boot;
      try { window.__LH_APP__(); } finally { setTimeout(hideSplash, 200); }
    }
    function fetchBoot() {
      return fetch(API, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: 'boot', args: [{}] }), credentials: 'omit', redirect: 'follow', cache: 'no-store'
      }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (r) {
          if (!r || !r.ok || !r.data || !r.data.config) throw new Error((r && r.error) || 'No data');
          try { localStorage.setItem(BOOT_KEY, JSON.stringify({ at: Date.now(), data: r.data })); } catch (e) { /* storage full or blocked */ }
          return r.data;
        });
    }
    // Opened before on this phone: start at once from the saved settings, refresh them for next time.
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(BOOT_KEY) || 'null'); } catch (e) { saved = null; }
    if (saved && saved.data && saved.data.config && Date.now() - saved.at < 14 * 86400000) {
      start(saved.data);
      fetchBoot().catch(function () { /* offline: keep the saved copy */ });
      return;
    }
    if (navigator.onLine === false) {
      notice("You're offline", 'Lighthouse needs the internet the first time. Connect to Wi-Fi or mobile data, then try again.', true);
      window.addEventListener('online', function () { location.reload(); });
      return;
    }
    var slow = setTimeout(function () {
      var p = document.createElement('p');
      p.style.cssText = 'margin:0;color:rgba(255,255,255,.8);font-size:.95rem';
      p.textContent = 'Taking a little longer than usual…';
      splash.appendChild(p);
    }, 8000);
    fetchBoot().then(function (b) { clearTimeout(slow); start(b); }).catch(function (err) {
      clearTimeout(slow);
      console.error(err);
      notice("We couldn't reach Lighthouse", 'Please check your internet connection and try again. If it keeps happening, let a church admin know.', true);
    });
  })();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  </script>
