  function renderReadings(items) {
    const body = document.getElementById('view-body');
    if (!body) return;
    if (!items.length) { body.innerHTML = emptyCard('📚', t('rd.none')); return; }
    const types = Object.keys(READING_TYPES).filter(function (ty) { return items.some(function (r) { return r.type === ty; }); });
    const tags = [];
    items.forEach(function (r) { r.tags.forEach(function (tg) { if (tags.indexOf(tg) === -1) tags.push(tg); }); });
    const featured = items.find(function (r) { return r.isFeatured; });
    const filtered = items.filter(function (r) {
      return (readingFilter.type === 'all' || r.type === readingFilter.type) && (!readingFilter.tag || r.tags.indexOf(readingFilter.tag) !== -1);
    });
    const filtering = readingFilter.type !== 'all' || readingFilter.tag;
    let html = '';
    if (featured && !filtering) html += readingCard(featured, true);
    html += '<div class="chips" role="group" aria-label="' + esc(t('rd.filterType')) + '">' +
      chipBtn('readingType', 'all', t('rd.all'), readingFilter.type === 'all') +
      types.map(function (ty) { return chipBtn('readingType', ty, t(READING_TYPES[ty][0]), readingFilter.type === ty); }).join('') + '</div>';
    if (tags.length) {
      html += '<div class="chips" role="group" aria-label="' + esc(t('rd.filterTopic')) + '">' +
        tags.map(function (tg) { return chipBtn('readingTag', tg, '#' + tg, readingFilter.tag === tg); }).join('') + '</div>';
    }
    const list = filtering ? filtered : filtered.filter(function (r) { return r !== featured; });
    html += list.length
      ? '<div class="grid grid-2">' + list.map(function (r) { return readingCard(r, false); }).join('') + '</div>'
      : emptyCard('🔍', t('rd.noneFilter'));
    body.innerHTML = html;
    body._items = items;
  }

  let eventFilter = '';   // '' = all categories

    return '<button type="button" class="row-card" data-go="event" data-id="' + esc(ev.id) + '">' + dateBlock(ev.startKey) +
      '<span class="rc-text"><span class="rc-title">' + esc(ev.title) + '</span>' +

      '</span><span class="chev">' + icon('chevron', 'icon-sm') + '</span></button>';

  function renderEvents(items) {
    const body = document.getElementById('view-body');
    if (!body) return;
    const cats = [];
    items.forEach(function (e) { if (cats.indexOf(e.category) === -1) cats.push(e.category); });
    if (eventFilter && cats.indexOf(eventFilter) === -1) eventFilter = '';
    const filtered = items.filter(function (e) { return !eventFilter || e.category === eventFilter; });
    let html = cats.length > 1
      ? '<div class="chips" role="group" aria-label="' + esc(t('ev.filterCat')) + '">' +
          chipBtn('eventCat', '', t('ev.all'), !eventFilter) +
          cats.map(function (c) { const x = eventCat(c); return chipBtn('eventCat', c, (x.emoji ? x.emoji + ' ' : '') + x.label, eventFilter === c); }).join('') + '</div>'
      : '';
    if (state.params.view === 'calendar') {
      html += calendarHtml(filtered);
    } else if (!filtered.length) {
      html += emptyCard('📅', t('ev.none'));
    } else {
      let lastMonth = '';
      html += '<div class="stack">';
      filtered.forEach(function (e) {
        const m = fmtKey(e.startKey, { month: 'long', year: 'numeric' });
        if (m !== lastMonth) { html += '<h2 class="section-title">' + esc(m) + '</h2>'; lastMonth = m; }
        html += eventRow(e);
      });
      html += '</div>';
    }
    body.innerHTML = html;
    body._items = items;
  }

  function calendarHtml(items) {
    const today = todayKey();
    const tp = today.split('-').map(Number);
    if (!calMonth) calMonth = { y: tp[0], m: tp[1] };
    const y = calMonth.y, m = calMonth.m;
    const mm = ('0' + m).slice(-2);
    const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
    const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const byDay = {};
    items.forEach(function (e) { (byDay[e.startKey] = byDay[e.startKey] || []).push(e); });
    const isThisMonth = y === tp[0] && m === tp[1];
    if (!calDay || calDay.slice(0, 7) !== y + '-' + mm) calDay = isThisMonth ? today : '';

    let cells = '';
    for (let i = 0; i < first; i++) cells += '<span class="cal-cell cal-blank" aria-hidden="true"></span>';
    for (let d = 1; d <= days; d++) {
      const key = y + '-' + mm + '-' + ('0' + d).slice(-2);
      const n = (byDay[key] || []).length;
      cells += '<button type="button" class="cal-cell' + (key === today ? ' is-today' : '') + (n ? ' has-events' : '') + (key < today ? ' is-past' : '') + '"' +
        ' data-action="calDay" data-day="' + key + '" aria-pressed="' + (key === calDay) + '"' +
        ' aria-label="' + esc(fmtKey(key, { weekday: 'long', month: 'long', day: 'numeric' })) + (n ? ', ' + esc(n === 1 ? t('ev.act1') : t('ev.actN', { n: n })) : '') + '">' +
        d + (n ? '<span class="cal-dot" aria-hidden="true"></span>' : '') + '</button>';
    }
    const canPrev = y > tp[0] || (y === tp[0] && m > tp[1]);
    const dayEvents = calDay ? (byDay[calDay] || []) : [];
    return '<div class="card cal">' +
        '<div class="cal-head">' +
          '<button type="button" class="icon-btn" data-action="calNav" data-dir="-1" aria-label="' + esc(t('ev.prevMonth')) + '"' + (canPrev ? '' : ' disabled') + '>' + icon('back') + '</button>' +
          '<h2>' + esc(fmtKey(y + '-' + mm + '-01', { month: 'long', year: 'numeric' })) + '</h2>' +
          '<button type="button" class="icon-btn" data-action="calNav" data-dir="1" aria-label="' + esc(t('ev.nextMonth')) + '">' + icon('chevron') + '</button>' +
        '</div>' +
        '<div class="cal-grid">' + tList('date.weekdaysInitial').map(function (w) { return '<span class="cal-wd" aria-hidden="true">' + esc(w) + '</span>'; }).join('') + cells + '</div>' +
      '</div>' +
      (calDay
        ? '<h2 class="section-title">' + esc(fmtKey(calDay, { weekday: 'long', month: 'long', day: 'numeric' })) + '</h2>' +
          (dayEvents.length ? '<div class="stack">' + dayEvents.map(eventRow).join('') + '</div>' : '<p class="muted">' + esc(t('ev.nothingDay')) + '</p>')
        : '<p class="muted" style="margin-top:12px">' + esc(t('ev.tapDay')) + '</p>');
  }

  function gcalUrl(ev) {
    const fmt = function (ms) { return new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); };
    const end = ev.endMs || ev.startMs + 3600000;
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      '&text=' + encodeURIComponent(ev.title) +
      '&dates=' + fmt(ev.startMs) + '/' + fmt(end) +
      '&details=' + encodeURIComponent((ev.description || '') + '\n\n' + (CFG.churchName || 'Lighthouse')) +
      '&location=' + encodeURIComponent(ev.location || '') +
      '&ctz=' + encodeURIComponent(TZ);
  }
  function mapUrl(ev) {
    if (safeUrl(ev.mapLink)) return ev.mapLink;
    return ev.location ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(ev.location) : '';
  }

      '</header>' +
      '<div class="stack">' +
        '<section class="card">' +
          '<p class="info-line">' + icon('calendar', 'icon-sm') + '<span>' + esc(fmtMs(ev.startMs, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })) + '<br>' +
            '<span class="muted">' + esc(eventTimes(ev)) + '</span></span></p>' +
          (ev.location ? '<p class="info-line"><span class="icon-sm" aria-hidden="true">📍</span><span>' + esc(ev.location) + '</span></p>' : '') +

  /**
   * The joining card. Events without approval: going / maybe / can't (waiting list when full).
   * Events with approval: ask to join (or the waiting list when full); the organizer decides.
   */
  function rsvpHtml(ev) {
    if (!ev.rsvpEnabled) return '';
    const count = ev.goingCount ? (ev.goingCount === 1 ? t('ev.going1') : t('ev.goingN', { n: ev.goingCount })) : t('ev.first');
    const spots = ev.capacity
      ? ' · ' + (ev.isFull ? t('ev.fullWait', { n: ev.waitlistCount || 0 }) : t('ev.spotsOf', { left: ev.spotsLeft, total: ev.capacity }))
      : '';
    const btn = function (status, label, primary) {
      return '<button type="button" class="btn ' + (primary ? 'btn-primary' : 'btn-ghost') + '" data-action="rsvp" data-id="' + esc(ev.id) + '" data-status="' + status + '">' + esc(label) + '</button>';
    };
    const noteBox = '<div class="field" style="margin-top:10px"><label for="rsvp-note">' + optLabel(t('ev.msgOrganizer')) + '</label>' +
      '<textarea class="input" id="rsvp-note" rows="2" maxlength="300" placeholder="' + esc(t('ev.msgPh')) + '"></textarea></div>';
    let body = '';
    const st = ev.myRsvp;
    if (st === 'going') {
      body = '<p class="rsvp-state ok">🎉 ' + esc(t('ev.st.going')) + '</p><div class="rsvp-btns">' + btn('cancelled', t('ev.cantMake')) + '</div>';
    } else if (st === 'requested') {
      body = '<p class="rsvp-state">⏳ ' + esc(t('ev.st.requestedLong')) + '</p><div class="rsvp-btns">' + btn('cancelled', t('ev.cancelRequest')) + '</div>';
    } else if (st === 'waitlist') {
      body = '<p class="rsvp-state">🪑 ' + esc(t('ev.st.waitLong', { n: ev.myWaitPos || 1 })) + '</p><div class="rsvp-btns">' + btn('cancelled', t('ev.leaveWait')) + '</div>';
    } else if (st === 'declined') {
      body = '<p class="rsvp-state">' + esc(t('ev.st.declined')) + '</p>' +
        (ev.myNote ? '<blockquote class="greet-msg"><p>' + nl2br(esc(ev.myNote)) + '</p></blockquote>' : '');
    } else if (ev.needsApproval) {
      body = '<p class="muted small">' + esc(t('ev.approvalNote')) + '</p>' + noteBox +
        '<div class="rsvp-btns">' + (ev.isFull ? btn('waitlist', t('ev.joinWait'), true) : btn('going', t('ev.askJoin'), true)) + '</div>';
    } else if (ev.isFull) {
      body = '<p class="muted small">' + esc(t('ev.fullNote2')) + '</p><div class="rsvp-btns">' + btn('waitlist', t('ev.joinWait'), true) +
        (st === 'maybe' ? btn('cancelled', t('ev.rsvpNo')) : '') + '</div>';
    } else {
      const opts = [['going', t('ev.rsvpGoing')], ['maybe', t('ev.rsvpMaybe')], ['cancelled', t('ev.rsvpNo')]];
      body = '<div class="rsvp-btns" role="group" aria-label="RSVP">' + opts.map(function (o) {
        const pressed = st === o[0];
        return '<button type="button" class="btn ' + (pressed ? 'btn-primary' : 'btn-ghost') + '" data-action="rsvp" data-id="' + esc(ev.id) + '" data-status="' + o[0] + '" aria-pressed="' + pressed + '">' + esc(o[1]) + '</button>';
      }).join('') + '</div>';
    }
    return '<section class="card"><h2>' + esc(t('ev.join')) + '</h2><p class="muted">' + esc(count + spots) + '</p>' + body + '</section>';
  }

    const person = function (p, extra, n) {
      return '<li class="er-person"><div class="er-who"><strong>' + (n ? n + '. ' : '') + esc(p.fullName || p.name) + '</strong>' + contact(p) + '</div>' +
        (p.note ? '<p class="er-msg">“' + esc(p.note) + '”</p>' : '') + (extra || '') + '</li>';
    };
    body.innerHTML = '<div class="stack">' + d.items.map(function (e) {
      const room = e.spotsLeft === null || e.spotsLeft > 0;
      const sec = function (title, list, render) {
        return list.length ? '<h3 class="er-h">' + esc(title) + ' <span class="chip chip-soft">' + list.length + '</span></h3><ul class="er-list">' + list.map(render).join('') + '</ul>' : '';

          esc(e.capacity ? (room ? t('ev.spotsOf', { left: e.spotsLeft, total: e.capacity }) : t('ev.full')) : t('er.noLimit')) +
          (e.needsApproval ? ' · ' + esc(t('ev.needsApprovalShort')) : '') + '</p>' +
        (!room && (e.requested.length || e.waitlist.length) ? '<p class="soft-note pad small">' + esc(t('er.fullHint')) + '</p>' : '') +
        sec(t('er.asking'), e.requested, function (p) { return person(p, decide(p, room)); }) +
        sec(t('er.waiting'), e.waitlist, function (p, i) { return person(p, decide(p, room), i + 1); }) +
        sec(t('er.going'), e.going, function (p) { return person(p, ''); }) +
        sec(t('er.maybe'), e.maybe, function (p) { return person(p, ''); }) +
        sec(t('er.declined'), e.declined, function (p) {
          return person(p, (p.decisionNote ? '<p class="muted small">' + esc(t('er.yourNote', { note: p.decisionNote })) + '</p>' : '') +

        '</section>';

  /* ---------------- Content manager (leaders & admins) ---------------- */
  const MANAGE_TYPES = [
    { key: 'events', icon: 'calendar' },
    { key: 'announcements', icon: 'megaphone' },
    { key: 'sermons', icon: 'play' },
    { key: 'series', icon: 'grid' },
    { key: 'readings', icon: 'book' },
    { key: 'devotionals', icon: 'sun' },
    { key: 'verses', icon: 'book' },
    { key: 'eventCategories', icon: 'grid' },
    { key: 'ministries', icon: 'hand' },
    { key: 'groups', icon: 'users' }
  ];
  /** Which member-facing caches to refresh after a change. */
  const MANAGE_REFRESH = {
    events: ['events', 'home'], announcements: ['announcements', 'home'],
    sermons: ['sermons', 'home'], series: ['sermons', 'home'], readings: ['readings'], devotionals: ['home'], verses: ['home'], eventCategories: ['events', 'home'], ministries: ['serve'], groups: ['home']
  };
  let cmsData = {};

  function isLeader() { const r = state.user && state.user.role; return r === 'admin' || r === 'leader'; }
  function isAdmin() { return !!(state.user && state.user.role === 'admin'); }
  /** What this person may do. Admins: everything. Leaders: what an admin switched on. */
  function can(perm) { return isAdmin() || !!(state.user && state.user.role === 'leader' && state.user.perms && state.user.perms[perm]); }
  const CMS_PERM = { events: 'events', announcements: 'announcements', sermons: 'sermons', series: 'sermons', readings: 'readings', devotionals: 'devotionals', verses: 'devotionals', eventCategories: 'adminOnly', ministries: 'adminOnly' };
  function canManageType(type) { return type === 'groups' ? isLeader() : can(CMS_PERM[type]); } // leaders may add life groups (admins approve)
  function myManageTypes() { return MANAGE_TYPES.filter(function (x) { return canManageType(x.key); }); }
  function manageType(key) {
    // A leader may open the edit form for a life group they lead (the server checks it's theirs).
    if (key === 'groups' && isLeader() && state.route === 'manageEdit' && state.params.id) return MANAGE_TYPES.find(function (x) { return x.key === key; });
    return myManageTypes().find(function (x) { return x.key === key; });
  }

  /** Small "＋ Add" / "✏️ Edit" button shown to leaders on member pages. */
  function leaderBtn(type, id) {
    if (!isLeader() || !canManageType(type)) return '';
    return '<button type="button" class="btn btn-soft leader-btn" data-go="manageEdit" data-key="' + esc(type) + '"' +
      (id ? ' data-id="' + esc(id) + '"' : '') + '>' + (id ? '✏️ ' + esc(t('mg.edit.' + type)) : '＋ ' + esc(t('mg.add.' + type))) + '</button>';
  }

  function notLeaderCard() { return emptyCard('🔒', t('mg.notLeader')); }

  /** A Manage link; badgeKey names a "waiting for you" number filled in after the page opens. */
  function mgLink(go, iconName, title, sub, key, badgeKey) {
    return '<button type="button" class="list-link" data-go="' + go + '"' + (key ? ' data-key="' + esc(key) + '"' : '') + '>' +
      '<span class="card-icon">' + icon(iconName) + '</span>' +
      '<span class="ll-text"><span class="ll-title">' + esc(title) + (badgeKey ? ' <span class="chip chip-accent" data-badge="' + badgeKey + '" hidden></span>' : '') + '</span>' +
      (sub ? '<span class="ll-sub">' + esc(sub) + '</span>' : '') + '</span>' +
      '<span class="chev">' + icon('chevron', 'icon-sm') + '</span></button>';

  function mgSection(title, items) {
    return items ? '<div class="more-group"><h2>' + esc(title) + '</h2><div class="list">' + items + '</div></div>' : '';
  }

  /**
   * Manage: every leader and admin tool in one place (the Dashboard keeps only the stats).
   * Sections: people & care, content, app setup.
   */
  function viewManage() {
    if (!isLeader()) return notLeaderCard();
    const people =
      (can('people') ? mgLink('people', 'users', t('dash.l.people'), t('dash.l.peopleSub')) : '') +
      (can('pipeline') ? mgLink('pipeline', 'hand', t('dash.l.pipeline'), t('dash.l.pipelineSub'), '', 'interested') : '') +
      ((isAdmin() || can('pastoral')) && FEATURES.prayer !== false ? mgLink('prayerCare', 'heart', t('pc.title'), t('pc.sub'), '', 'prayerWaiting') : '') +
      (can('care') && FEATURES.pastoralCare !== false ? mgLink('care', 'heart', t('cr.title'), t('cr.linkSub')) : '') +
      (FEATURES.guestForm !== false ? mgLink('guests', 'hand', t('gt.title'), isAdmin() ? t('gt.linkSubAdmin') : t('gt.linkSub'), '', 'guests') : '') +
      (FEATURES.events !== false ? mgLink('eventRequests', 'calendar', t('er.title'), t('er.linkSub'), '', 'eventRequests') : '') +
      (FEATURES.smallGroups !== false && isAdmin() ? mgLink('groupApprovals', 'users', t('lg.ap.title'), t('lg.ap.linkSub'), '', 'groupsWaiting') : '') +
      (FEATURES.smallGroups !== false ? mgLink('groupRequests', 'users', t('lg.requests'), t('lg.requestsSub'), '', 'groupRequests') : '') +
      (state.user.leadsMinistry && FEATURES.servingSchedule !== false ? mgLink('serveManage', 'calendar', t('sm.title'), t('sm.linkSub'), '', 'serveWaiting') : '') +
      (isAdmin() && FEATURES.testimonies !== false ? mgLink('testimonies', 'chat', t('ts.title'), t('ts.linkSub')) : '') +
      (isWellnessStaff() && FEATURES.wellness !== false ? mgLink('wellnessTeam', 'pulse', t('wl.team.title'), t('wl.dash.linkSub')) : '');
    const content = myManageTypes().map(function (x) {
      return mgLink('manageList', x.icon, t('mg.t.' + x.key), x.key === 'verses' ? verseLinkSub() : t('mg.s.' + x.key), x.key);
    }).join('');
    const setup = isAdmin()
      ? mgLink('features', 'grid', t('ft.title'), t('ft.linkSub')) + mgLink('leaderAccess', 'users', t('la.title'), t('la.sub')) +
        mgLink('qadmin', 'clipboard', t('qa.title'), t('qa.sub')) + mgLink('settings', 'grid', t('cfg.title'), t('cfg.sub'))
      : '';
    const all = people + content + setup;
    return '<header class="page-head"><h1>' + esc(t('mg.title')) + '</h1><p class="muted">' + esc(t('mg.sub')) + '</p></header>' +
      (can('dashboard') ? '<div class="list mg-dash">' + mgLink('dash', 'chart', t('more.dash'), t('more.dashSub')) + '</div>' : '') +
      (all ? mgSection(t('mg.sec.people'), people) + mgSection(t('mg.sec.content'), content) + mgSection(t('mg.sec.setup'), setup)
           : emptyCard('🌱', t('la.nothingYet'))) +
      '<p class="muted small" style="margin-top:14px">' + esc(isAdmin() ? t('mg.auditAdmin') : t('mg.auditLeader')) + '</p>';
  }
  async function afterManage() {
    if (!isLeader()) return;
    let n;
    try { n = await cached('mgCounts', 15000, function () { return api('manage.counts'); }); } catch (e) { return; }
    Object.keys(n || {}).forEach(function (k) {

  function viewManageList() {
    if (!isLeader()) return notLeaderCard();
    const x = manageType(state.params.key);
    if (!x) return emptyCard('🔍', t('mg.noSection'));
    return backBtn('manage', {}, t('mg.title')) +

        '<button type="button" class="btn btn-primary" data-go="manageEdit" data-key="' + x.key + '">＋ ' + esc(t('mg.add.' + x.key)) + '</button></header>' +

  async function loadCms(type, fresh) {
    if (!fresh && cmsData[type]) return cmsData[type];
    const d = await api('cms.list', { type: type });
    cmsData[type] = d;
    return d;
  }

  /** Admin bulk-delete selection for the manage list. */
  let cmsSelect = { on: false, ids: {} };

  async function afterManageList() {
    if (!isLeader() || !manageType(state.params.key)) return;
    cmsSelect = { on: false, ids: {} };
    const d = await load(function () { return loadCms(state.params.key, true); });
    if (!d) return;
    renderManageList(d);
  }

  function selectedCount() { return Object.keys(cmsSelect.ids).length; }

  function renderManageList(d) {
    const body = document.getElementById('view-body');
    if (!body) return;
    if (!d.items.length) {
      body.innerHTML = emptyCard('🌱', t('mg.empty'));
      return;
    }
    const current = d.items.filter(function (i) { return !i.past; });
    const past = d.items.filter(function (i) { return i.past; });
    const isEvents = d.type === 'events';
    const selecting = cmsSelect.on;

    function rows(list) {
      return '<div class="list">' + list.map(function (i) {
        const text = '<span class="ll-text"><span class="ll-title">' + esc(i.title) + '</span>' +
          (i.sub ? '<span class="ll-sub">' + esc(i.sub) + '</span>' : '') + '</span>' +
          (i.status === 'upcoming' ? '<span class="chip">' + esc(t('mg.upcoming')) + '</span>' : '');
        if (selecting) {
          return '<label class="list-link select-row"><input type="checkbox" data-cms-pick="' + esc(i.id) + '"' + (cmsSelect.ids[i.id] ? ' checked' : '') +
            ' aria-label="' + esc(t('mg.selectItem', { title: i.title })) + '">' + text + '</label>';
        }
        return '<button type="button" class="list-link" data-go="manageEdit" data-key="' + esc(d.type) + '" data-id="' + esc(i.id) + '">' + text +
          '<span class="chev">' + icon('chevron', 'icon-sm') + '</span></button>';
      }).join('') + '</div>';
    }

    let tools = '';
    if (d.canDelete) {
      if (!selecting) {
        tools = '<div class="row bulk-tools">' +
          '<button type="button" class="btn btn-ghost" data-action="cmsSelectMode">' + esc(t('mg.selectMode')) + '</button>' +
          (past.length ? '<button type="button" class="btn btn-danger-ghost" data-action="cmsSelectPast">' + esc(t(isEvents ? 'mg.clearPast' : 'mg.clearExpired', { n: past.length })) + '</button>' : '') +
          '</div>';
      } else {
        tools = '<div class="row bulk-tools">' +
          '<button type="button" class="chip-btn" data-action="cmsSelectAll">' + esc(t('mg.selectAll', { n: d.items.length })) + '</button>' +
          (past.length ? '<button type="button" class="chip-btn" data-action="cmsSelectPast">' + esc(t(isEvents ? 'mg.selectPast' : 'mg.selectExpired', { n: past.length })) + '</button>' : '') +
          '<button type="button" class="chip-btn" data-action="cmsSelectNone">' + esc(t('mg.clearSel')) + '</button>' +
          '<button type="button" class="chip-btn" data-action="cmsSelectCancel">' + esc(t('common.cancel')) + '</button>' +
          '</div>';
      }
    }

    body.innerHTML = tools +
      (current.length ? rows(current) : '') +
      (past.length ? '<h2 class="section-title">' + esc(isEvents ? t('mg.pastEvents') : t('mg.expired')) + '</h2>' + rows(past) : '') +
      (selecting
        ? '<div class="bulk-bar"><button type="button" class="btn btn-block btn-lg bulk-delete" data-action="cmsDeleteSelected"' + (selectedCount() ? '' : ' disabled') + '>' +
            esc(t('mg.deleteSel', { n: selectedCount() })) + '</button></div>'
        : '');
  }

  function rerenderManageList() {
    const d = cmsData[state.params.key];
    if (d) renderManageList(d);
  }

  function viewManageEdit() {
    if (!isLeader()) return notLeaderCard();
    const x = manageType(state.params.key);
    if (!x) return emptyCard('🔍', t('mg.noSection'));
    return backBtn('manageList', { key: x.key }, t('mg.t.' + x.key)) +
      '<header class="page-head"><h1>' + esc(state.params.id ? t('mg.edit.' + x.key) : t('mg.add.' + x.key)) + '</h1></header>' +
      '<div id="view-body">' + skelCards(1) + '</div>';
  }

  /** On a life group's edit form: where it stands with the admins (leaders see why it was sent back). */
  function groupApprovalNote(item) {
    if (!item) return isAdmin() ? '' : '<p class="soft-note pad">⏳ ' + esc(t('lg.ap.newNote')) + '</p>';
    if (item.approval === 'pending') return '<p class="soft-note pad">⏳ ' + esc(t('lg.ap.pendingNote')) + '</p>';
    if (item.approval === 'declined') return '<div class="soft-note pad">↩️ ' + esc(t('lg.ap.declinedNote')) +
      (item.reviewNote ? '<blockquote class="greet-msg"><p>' + nl2br(esc(item.reviewNote)) + '</p></blockquote>' : '') + '</div>';
    return '';
  }

  async function afterManageEdit() {
    const x = manageType(state.params.key);
    if (!isLeader() || !x) return;
    const d = await load(function () { return loadCms(x.key, false); });
    if (!d) return;
    const id = state.params.id || '';
    const item = id ? d.items.find(function (i) { return i.id === id; }) : null;
    const body = document.getElementById('view-body');
    if (id && !item) { body.innerHTML = emptyCard('🔍', t('mg.itemMissing')); return; }
    const values = item ? item.values : {};
    body.innerHTML =
      '<form class="card" data-form="cms" novalidate>' +
        '<input type="hidden" name="__type" value="' + esc(x.key) + '">' +
        '<input type="hidden" name="__id" value="' + esc(id) + '">' +
        (x.key === 'groups' ? groupApprovalNote(item) : '') +
        d.fields.filter(function (f) { return !(x.key === 'groups' && f.key === 'leaderUserId' && !isAdmin()); })
          .map(function (f) { return cmsField(f, item ? values[f.key] : f.def); }).join('') +
        (x.key === 'events' ? '<div class="field notify-tick">' + checkRow('__notify', '🔔 ' + t('ev.notifyTick'), !id) +
          '<span class="hint">' + esc(id ? t('ev.notifyHelpEdit2') : t('ev.notifyHelpNew2')) + '</span></div>' +
          (item && item.emailed
            ? '<p class="muted small notify-tick">📧 ' + esc(t('ev.emailedOnce')) + '</p>'
            : '<div class="field notify-tick">' + checkRow('__emailAll', '📧 ' + t('ev.emailAllTick'), !id) +
                '<span class="hint">' + esc(t('ev.emailAllHelp') + (isAdmin() ? '' : ' ' + t('ev.emailAllLeader'))) + '</span></div>') : '') +
        '<button type="submit" class="btn btn-primary btn-block btn-lg">' + esc(id ? t('mg.saveChanges') : (x.key === 'groups' && !isAdmin() ? t('lg.ap.submit') : t('mg.add.' + x.key))) + '</button>' +
      '</form>' +
      (id && d.canDelete
        ? '<div class="card" style="margin-top:14px"><button type="button" class="btn btn-danger-ghost btn-block" data-action="cmsDelete" data-key="' + esc(x.key) + '" data-id="' + esc(id) + '">' + esc(t('mg.del.' + x.key)) + '</button>' +
          '<p class="muted small" style="margin:8px 0 0">' + esc(t('mg.noUndo')) + '</p></div>'
        : '');
    // A new event: leaving Organizer blank makes it you.
    if (x.key === 'events' && !id) {
      const org = body.querySelector('select[name="organizerUserId"] option[value=""]');
      if (org) org.textContent = t('ev.orgMe');
    }
    // Editing an event: changing the date, time or place ticks "Let people know" for you.
    if (x.key === 'events' && id) {
      const form = body.querySelector('[data-form="cms"]');
      form.addEventListener('change', function (e) {
        if (['startDateTime', 'endDateTime', 'location'].indexOf(e.target.name) !== -1) {
          const tick = form.querySelector('input[name="__notify"]');
          if (tick) tick.checked = true;
        }
      });
    }
  }

  function cmsField(f, val) {
    const id = 'cms-' + f.key;
    const v = val === undefined || val === null ? '' : val;
    const opt = f.required ? '' : ' <span class="muted small">' + esc(t('common.optional')) + '</span>';
    const help = f.help ? '<span class="hint">' + esc(f.help) + '</span>' : '';
    const req = f.required ? ' required' : '';
    if (f.type === 'bool') {
      return '<div class="field"><label class="check"><input type="checkbox" name="' + esc(f.key) + '"' + (v === true ? ' checked' : '') + '><span>' + esc(f.label) + '</span></label>' + help + '</div>';
    }
    if (f.type === 'checklist') {
      const picked = String(v || '').split(',').map(function (x) { return x.trim(); });
      return '<fieldset class="field"><legend>' + esc(f.label) + opt + '</legend>' +
        ((f.options || []).length ? '<div class="nf-grid">' + f.options.map(function (o) {
          return '<label class="check"><input type="checkbox" data-checklist="' + esc(f.key) + '" value="' + esc(o.value) + '"' + (picked.indexOf(String(o.value)) !== -1 ? ' checked' : '') + '><span>' + esc(o.label) + '</span></label>';
        }).join('') + '</div>' : '<p class="muted small">' + esc(t('srv.noLeadersYet')) + '</p>') + help + '</fieldset>';
    }
    let input;
    switch (f.type) {
      case 'textarea':
        input = '<textarea class="input" id="' + id + '" name="' + esc(f.key) + '" rows="' + (f.rows || 4) + '" maxlength="' + (f.max || 3000) + '"' + req + '>' + esc(v) + '</textarea>';
        break;
      case 'select':
        input = '<select class="input" id="' + id + '" name="' + esc(f.key) + '"' + req + '>' + (f.options || []).map(function (o) {
          return '<option value="' + esc(o.value) + '"' + (String(o.value) === String(v) ? ' selected' : '') + '>' + esc(o.label) + '</option>';
        }).join('') + '</select>';
        break;
      case 'date':
        input = '<input class="input" type="date" id="' + id + '" name="' + esc(f.key) + '" value="' + esc(v) + '"' + req + '>';
        break;
      case 'datetime':
        input = '<input class="input" type="datetime-local" id="' + id + '" name="' + esc(f.key) + '" value="' + esc(v) + '"' + req + '>';
        break;
      case 'number':
        input = '<input class="input" type="number" min="0" step="1" inputmode="numeric" id="' + id + '" name="' + esc(f.key) + '" value="' + esc(v) + '">';
        break;
      case 'url': case 'image': case 'youtube':
        input = '<input class="input" type="url" inputmode="url" placeholder="https://" id="' + id + '" name="' + esc(f.key) + '" value="' + esc(v) + '">';
        break;
      default:
        input = '<input class="input" type="text" id="' + id + '" name="' + esc(f.key) + '" maxlength="' + (f.max || 200) + '" value="' + esc(v) + '"' + req + '>';
    }
    return '<div class="field"><label for="' + id + '">' + esc(f.label) + opt + '</label>' + input + help + '</div>';
  }

  /* ---------------- More ---------------- */
  /** Everything in "More". `key` matches the feature toggle name; titles come from mod.<key>. */
  const MODULES = [
    { key: 'announcements',   group: 'loop', icon: 'megaphone' },
    { key: 'birthdays',       group: 'loop', icon: 'cake' },
    { key: 'readings',        group: 'grow', icon: 'book' },
    { key: 'devotional',      group: 'grow', icon: 'sun' },
    { key: 'gifts',           group: 'grow', icon: 'star' },
    { key: 'journey',         group: 'grow', icon: 'clipboard' },
    { key: 'growing',         group: 'grow', icon: 'leaf', feature: 'journey' },
    { key: 'smallGroups',     group: 'belong', icon: 'users' },
    { key: 'testimonies',     group: 'belong', icon: 'chat' },
    { key: 'directory',       group: 'belong', icon: 'contact' },
    { key: 'volunteer',       group: 'serve', icon: 'hand' },
    { key: 'servingSchedule', group: 'serve', icon: 'calendar' },
    { key: 'giving',          group: 'give', icon: 'gift' },
    { key: 'wellness',        group: 'care', icon: 'leaf' },
    { key: 'installApp',      group: 'settings', icon: 'phone', always: true }
  ];

  function moduleVisible(m) {
    // "Would you like to serve?" opens the Serve page (questionnaire first), so My serving schedule isn't listed twice.
    if (m.key === 'servingSchedule' && FEATURES.volunteer !== false) return false;
    // Already opened from the home screen: nothing left to install.
    if (m.key === 'installApp' && STATIC && STANDALONE) return false;
    return m.always || FEATURES[m.feature || m.key] !== false;
  }

  function viewMore() {
    const u = state.user || {};
    const groups = {};
    const order = [];
    MODULES.filter(moduleVisible).forEach(function (m) {
      if (!groups[m.group]) { groups[m.group] = []; order.push(m.group); }
      groups[m.group].push(m);
    });
    function link(goTo, param, iconName, title, sub) {
      return '<button type="button" class="list-link" data-go="' + goTo + '"' + (param ? ' data-key="' + esc(param) + '"' : '') + '>' +
        '<span class="card-icon">' + icon(iconName) + '</span>' +
        '<span class="ll-text"><span class="ll-title">' + esc(title) + '</span>' + (sub ? '<span class="ll-sub">' + esc(sub) + '</span>' : '') + '</span>' +
        '<span class="chev">' + icon('chevron', 'icon-sm') + '</span></button>';
    }
    let html = '<header class="page-head"><h1>' + esc(t('more.title')) + '</h1><p class="muted">' + esc(t('more.sub')) + '</p></header>';
    html += '<div class="more-group"><div class="list">' + link('profile', '', 'user', t('more.profile'), u.fullName || '') +
      link('mySettings', '', 'gear', t('st.title'), t('st.linkSub')) + '</div></div>';
    if (isLeader()) {
      html += '<div class="more-group"><h2>' + esc(t('more.leaders')) + '</h2><div class="list">' +
        link('manage', '', 'shield', t('more.manage'), t('more.manageSub')) +
        (can('dashboard') ? link('dash', '', 'chart', t('more.dash'), t('more.dashSub')) : '') + '</div></div>';
    }
    order.forEach(function (g) {
      html += '<div class="more-group"><h2>' + esc(t('grp.' + g)) + '</h2><div class="list">' +
        groups[g].map(function (m) {
          const title = t('mod.' + m.key), sub = t('mod.' + m.key + '.sub');
          const target = m.key === 'volunteer' && FEATURES.servingSchedule !== false ? ['serving'] : MODULE_ROUTES[m.key];
          return target ? link(target[0], target[1] || '', m.icon, title, sub) : link('module', m.key, m.icon, title, sub);
        }).join('') +
        '</div></div>';
    });
    return html;
  }

  function viewComingSoon(key) {
    const special = {

  /* ---------------- Prayer wall ---------------- */
  const PRAYER_TABS = ['wall', 'foryou', 'mine', 'praise'];
  const PULSE_MS = 45000;
  let pulseTimer = null;
  let memberSearchTimer = null;

  function prayerTab() { return PRAYER_TABS.indexOf(state.params.tab) !== -1 ? state.params.tab : 'wall'; }
  function invalidatePrayer() { PRAYER_TABS.forEach(function (x) { invalidate('prayer_' + x); }); invalidate('home', 'prayerCare'); }
  function stopPulse() { if (pulseTimer) { clearInterval(pulseTimer); pulseTimer = null; } }

  /** "just now", "5 min ago", "yesterday"… */
  function agoText(ms) {
    if (!ms) return '';
    const d = Date.now() - ms;
    if (d < 60000) return t('pw.ago.now');
    if (d < 3600000) return t('pw.ago.min', { n: Math.floor(d / 60000) });
    if (d < 86400000) return t('pw.ago.hr', { n: Math.floor(d / 3600000) });
    if (d < 172800000) return t('pw.ago.yday');
    if (d < 7 * 86400000) return t('pw.ago.day', { n: Math.floor(d / 86400000) });
    return fmtMs(ms, { month: 'short', day: 'numeric' });
  }
  function prayCountText(n) {
    if (!n) return t('pw.count0');
    return n === 1 ? t('pw.count1') : t('pw.countN', { n: n });
  }

  /** Two-tap confirm for buttons like Remove and Report. Returns true on the second tap. */
  function armed(el, confirmLabel) {
    if (el.getAttribute('data-armed') === '1') return true;
    const original = el.textContent;
    el.setAttribute('data-armed', '1');
    el.textContent = confirmLabel;
    setTimeout(function () {
      if (document.body.contains(el)) { el.removeAttribute('data-armed'); el.textContent = original; }
    }, 5000);
    return false;
  }

  function encHtml(pid, e, canReport) {
    return '<li class="pr-enc"><span class="pr-enc-name">' + esc(e.mine ? t('pw.you') : e.name) + '</span> ' +
      '<span class="pr-enc-msg">' + esc(e.message) + '</span>' +
      (canReport && !e.mine ? ' <button type="button" class="linklike tiny" data-action="prReportMsg" data-id="' + esc(pid) + '" data-iid="' + esc(e.id) + '">' + esc(t('pw.report')) + '</button>' : '') +
      '</li>';
  }

  /**
   * One prayer card. opts.care = shown in Prayer care (names visible, no report link),
   * opts.actions = extra buttons for moderators.
   */
  function prayerCard(p, opts) {
    opts = opts || {};
    const open = p.status === 'active' || p.status === 'answered';
    const name = p.isMine ? t('pw.you') : (p.authorName || t('pw.anon'));
    const chips = [];
    if (p.type === 'person' && p.isMine) chips.push(['', t('pw.forPerson', { name: p.targetName })]);
    if (p.isForMe) chips.push(['chip-accent', t('pw.askedYou')]);
    if (p.type === 'pastoral') chips.push(['', t('pw.private')]);
    if (p.status === 'pending') chips.push(['chip-wait', t('pw.pendingChip')]);
    if (p.status === 'hidden') chips.push(['chip-wait', t('pw.hiddenChip')]);
    if (p.status === 'answered') chips.push(['chip-accent', t('pw.answeredChip')]);
    if (p.isMine && p.isAnonymous) chips.push(['', t('pw.anonChip')]);

    let html = '<article class="card pr-card' + (p.status === 'answered' ? ' pr-answered' : '') + '" data-pid="' + esc(p.id) + '">' +
      '<div class="pr-meta"><span class="pr-av" aria-hidden="true">' + (p.isMine || p.authorName ? esc(initials(name)) : '🙏') + '</span>' +
        '<span class="pr-who"><span class="pr-name">' + esc(name) + '</span>' +
        (opts.care && p.isAnonymous ? ' <span class="muted small">' + esc(t('pc.anonNote')) + '</span>' : '') +
        '<span class="muted small">' + esc(agoText(p.createdMs)) + '</span></span></div>' +
      (chips.length ? '<div class="pr-chips">' + chips.map(function (c) { return '<span class="chip ' + c[0] + '">' + esc(c[1]) + '</span>'; }).join('') + '</div>' : '') +
      '<h2 class="pr-title">' + esc(p.title) + '</h2>' +
      (p.details ? clampText(p.details, 'prd-' + p.id) : '');

    if (p.status === 'answered' && (p.answeredNote || p.answeredMs)) {
      html += '<div class="pr-praise"><p class="eyebrow">' + esc(t('pw.answeredChip')) + (p.answeredMs ? ' · ' + esc(agoText(p.answeredMs)) : '') + '</p>' +
        (p.answeredNote ? '<p>' + nl2br(esc(p.answeredNote)) + '</p>' : '') + '</div>';
    }
    if (opts.care && p.reportCount) html += '<p class="small pr-reports">⚠️ ' + esc(t('pc.reports', { n: p.reportCount })) + '</p>';

    if (open && !opts.noInteract) {
      html += '<div class="pr-pray-row">' +
        (p.status === 'active'
          ? '<button type="button" class="btn pr-pray" data-action="prPray" data-id="' + esc(p.id) + '" aria-pressed="' + !!p.prayedByMe + '">' + esc(p.prayedByMe ? t('pw.prayed') : t('pw.praying')) + '</button>'
          : '') +
        '<span class="pr-count small" data-count="' + esc(p.id) + '">' + esc(prayCountText(p.prayingCount)) + '</span></div>' +
        '<p class="pr-live small" data-live="' + esc(p.id) + '"' + (p.liveNow ? '' : ' hidden') + '><span class="pr-dot" aria-hidden="true"></span>' + esc(t('pw.live')) + '</p>';
    }

    // Encouragements. In Prayer care, admins also see hidden ones with a show/hide switch.
    const encs = p.encouragements || [];
    if (opts.care && encs.length && encs[0].hidden !== undefined) {
      html += '<ul class="pr-enc-list">' + encs.map(function (e) {
        return '<li class="pr-enc' + (e.hidden ? ' is-hidden' : '') + '"><span class="pr-enc-name">' + esc(e.name) + '</span> <span class="pr-enc-msg">' + esc(e.message) + '</span>' +
          (e.reports ? ' <span class="chip chip-wait">⚠️ ' + e.reports + '</span>' : '') +
          (e.hidden ? ' <span class="chip">' + esc(t('pc.hiddenMsg')) + '</span>' : '') +
          ' <button type="button" class="linklike tiny" data-action="prCareMsg" data-iid="' + esc(e.id) + '" data-hide="' + (e.hidden ? '0' : '1') + '">' + esc(e.hidden ? t('pc.showMsg') : t('pc.hideMsg')) + '</button></li>';
      }).join('') + '</ul>';
    } else {
      html += '<ul class="pr-enc-list" data-encs="' + esc(p.id) + '">' + encs.map(function (e) { return encHtml(p.id, e, !opts.care); }).join('') + '</ul>';
    }

    if (open && !opts.noInteract) {
      html += '<form class="pr-enc-form" data-form="encourage" novalidate>' +
        '<input type="hidden" name="id" value="' + esc(p.id) + '">' +
        '<label class="sr-only" for="pre-' + esc(p.id) + '">' + esc(t('pw.encLabel')) + '</label>' +
        '<input class="input" id="pre-' + esc(p.id) + '" name="message" maxlength="280" autocomplete="off" placeholder="' + esc(t('pw.encPh')) + '">' +
        '<button type="submit" class="btn btn-soft">' + esc(t('pw.encSend')) + '</button></form>';
    }

    const foot = [];
    if (p.isMine && p.status === 'active') foot.push('<button type="button" class="linklike small" data-action="prAnswerOpen" data-id="' + esc(p.id) + '">' + esc(t('pw.markAnswered')) + '</button>');
    if (p.isMine && p.status === 'answered' && !opts.care && FEATURES.testimonies !== false) foot.push('<button type="button" class="linklike small" data-go="testimonyNew" data-id="' + esc(p.id) + '">✍️ ' + esc(t('ts.shareThis')) + '</button>');
    if (p.isMine && !opts.care) foot.push('<button type="button" class="linklike small danger-link" data-action="prRemove" data-id="' + esc(p.id) + '">' + esc(t('pw.remove')) + '</button>');
    if (!p.isMine && !opts.care && open) foot.push('<button type="button" class="linklike small muted-link" data-action="prReport" data-id="' + esc(p.id) + '">' + esc(t('pw.report')) + '</button>');
    if (foot.length) html += '<div class="pr-foot">' + foot.join('') + '</div>';
    html += '<div data-answer="' + esc(p.id) + '"></div>';
    if (opts.actions) html += '<div class="pr-care-actions">' + opts.actions + '</div>';
    return html + '</article>';
  }

  function viewPrayer() {

    const tab = prayerTab();
    const d = await load(function () { return getPrayer(tab); });
    if (!d) return;
    const link = document.getElementById('pr-care-link');
    if (link && d.canModerate) {
      link.innerHTML = '<button type="button" class="btn btn-ghost" data-go="prayerCare">🛡️ ' +
        esc(d.waiting ? t('pw.careWaiting', { n: d.waiting }) : t('pw.care')) + '</button>';
    }
    let html = '';
    if (tab === 'foryou' && d.notes && d.notes.length) {
      html += '<section class="card pr-notes"><div class="card-head"><span class="card-icon">💌</span><h2>' + esc(t('pw.notesTitle')) + '</h2></div>' +
        d.notes.map(function (n) {
          return '<blockquote class="greet-msg"><p>' + (n.type === 'note_enc' ? '💛 ' : '🙏 ') + nl2br(esc(n.data.message || '')) + '</p>' +
            '<footer>' + esc(t('pw.noteFrom', { name: n.data.name || '' })) + ' · ' + esc(agoText(n.createdMs)) + '</footer></blockquote>';
        }).join('') + '</section>';
      const unread = d.notes.filter(function (n) { return !n.isRead; }).map(function (n) { return n.id; });
      if (unread.length) api('notifs.read', { ids: unread }).then(function () { invalidate('home'); }).catch(function () { /* fine */ });
    }
    const emptyKey = { wall: 'pw.emptyWall', foryou: 'pw.emptyForyou', mine: 'pw.emptyMine', praise: 'pw.emptyPraise' }[tab];
    if (d.items.length) html += '<div class="stack">' + d.items.map(function (p) { return prayerCard(p); }).join('') + '</div>';
    else if (!html) html = emptyCard(tab === 'praise' ? '🎉' : '🙏', t(emptyKey));
    document.getElementById('view-body').innerHTML = html;
    startPulse();
  }

  /** While the wall is open and visible, refresh the praying counts every 45 seconds. */
  function startPulse() {
    stopPulse();
    const seq = renderSeq;
    pulseTimer = setInterval(async function () {
      if (seq !== renderSeq || state.route !== 'prayer') return stopPulse();
      if (document.visibilityState !== 'visible') return;
      const ids = Array.prototype.map.call(document.querySelectorAll('#main [data-count]'), function (el) { return el.getAttribute('data-count'); });
      if (!ids.length) return;
      try {
        const res = await api('prayer.pulse', { ids: ids });
        if (seq !== renderSeq) return;
        Object.keys(res.items).forEach(function (id) { applyPulse(id, res.items[id]); });
      } catch (e) { /* quiet: we'll try again next time */ }
    }, PULSE_MS);
  }
  function applyPulse(id, v) {
    const c = document.querySelector('[data-count="' + id + '"]');
    if (c) c.textContent = prayCountText(v.prayingCount);
    const l = document.querySelector('[data-live="' + id + '"]');
    if (l) l.hidden = !v.liveNow;
    const b = document.querySelector('.pr-pray[data-id="' + id + '"]');
    if (b && v.prayedByMe && b.getAttribute('aria-pressed') !== 'true') { b.setAttribute('aria-pressed', 'true'); b.textContent = t('pw.prayed'); }
  }

      '<span class="label" id="pk-' + fieldName + '">' + esc(label) + '</span>' +
      '<input type="hidden" name="' + fieldName + '" value="">' +

        '<button type="button" class="linklike small" data-action="pickerClear">' + esc(t('pw.f.change')) + '</button></div>' +
      '<div class="picker-search">' +
        '<input class="input" type="search" data-member-search autocomplete="off" aria-labelledby="pk-' + fieldName + '" placeholder="' + esc(t('pw.f.search')) + '">' +
        '<div class="picker-results" aria-live="polite"></div></div>' +
      '</div>';
  }

  function runMemberSearch(input) {
    const box = input.closest('[data-picker]').querySelector('.picker-results');
    const q = input.value.trim();
    clearTimeout(memberSearchTimer);
    if (q.length < 2) { box.innerHTML = ''; return; }
    memberSearchTimer = setTimeout(async function () {
      try {
        const res = await api('members.search', { q: q });
        if (input.value.trim() !== q) return;
        box.innerHTML = res.items.length
          ? res.items.map(function (m) {
              return '<button type="button" class="picker-item" data-action="pickPerson" data-id="' + esc(m.id) + '" data-name="' + esc(m.name) + '">' +
                '<span class="pr-av" aria-hidden="true">' + esc(initials(m.name)) + '</span><span><strong>' + esc(m.name) + '</strong>' +
                (m.fullName && m.fullName !== m.name ? '<span class="muted small"> · ' + esc(m.fullName) + '</span>' : '') + '</span></button>';
            }).join('')
          : '<p class="muted small">' + esc(t('pw.f.noMatch')) + '</p>';
      } catch (e) { box.innerHTML = '<p class="form-error">' + esc(e.message) + '</p>'; }
    }, 300);
  }

    return backBtn('prayer', {}, t('pw.title')) +

  async function afterPrayerCare() {
    if (!isLeader()) return;
    const d = await load(function () { return cached('prayerCare', 20000, function () { return api('prayer.care'); }); });
    if (!d) return;
    const tabs = [];
    if (d.isAdmin) { tabs.push(['pending', d.pending]); tabs.push(['reported', d.reported]); }
    tabs.push(['pastoral', d.pastoral || []]);
    let tab = state.params.tab;
    if (!tabs.some(function (x) { return x[0] === tab; })) {
      const firstWithItems = tabs.find(function (x) { return x[1].length; });
      tab = (firstWithItems || tabs[0])[0];
    }
    const list = (tabs.find(function (x) { return x[0] === tab; }) || [null, []])[1];
    const btn = function (id, status, label, cls) {
      return '<button type="button" class="btn ' + (cls || 'btn-soft') + '" data-action="prCareSet" data-id="' + esc(id) + '" data-status="' + status + '">' + esc(label) + '</button>';
    };
    let html = '<div class="segmented pr-tabs" role="group">' + tabs.map(function (x) {
      return '<button type="button" class="seg-btn" data-go="prayerCare" data-tab="' + x[0] + '" aria-pressed="' + (x[0] === tab) + '">' + esc(t('pc.tab.' + x[0], { n: x[1].length })) + '</button>';
    }).join('') + '</div>';
    if (!list.length) html += emptyCard('💛', t('pc.empty'));
    else {
      html += '<div class="stack">' + list.map(function (p) {
        let actions = '';
        if (d.isAdmin) {
          if (tab === 'pending') actions = btn(p.id, 'active', t('pc.approve'), 'btn-primary') + btn(p.id, 'hidden', t('pc.hide')) + btn(p.id, 'archived', t('pc.archive'), 'btn-ghost');
          else if (tab === 'reported') actions = (p.status === 'hidden' ? btn(p.id, 'active', t('pc.restore'), 'btn-primary') : btn(p.id, 'hidden', t('pc.hide'))) + btn(p.id, 'archived', t('pc.archive'), 'btn-ghost');
          else actions = btn(p.id, 'archived', t('pc.archive'), 'btn-ghost');
        }
        const noInteract = p.status !== 'active' && p.status !== 'answered';
        return prayerCard(p, { care: true, actions: actions, noInteract: noInteract || tab !== 'pastoral' });
      }).join('') + '</div>';
    }
    document.getElementById('view-body').innerHTML = html;
  }

  /* ----- Updates for you (Home) ----- */
  function nDate(key) { return key ? fmtKey(key, { weekday: 'short', month: 'short', day: 'numeric' }) : ''; }
  function notifText(n) {
    const d = n.data || {};
    switch (n.type) {
      case 'prayed': return Number(d.n) > 1 ? t('nt.prayedN', { n: d.n, title: d.title || '' }) : t('nt.prayed1', { title: d.title || '' });
      case 'encouraged': return t('nt.encouraged', { name: d.name || '' });
      case 'prayer_for_you': return d.name ? t('nt.prayer_for_you', { name: d.name }) : t('nt.prayer_for_you_anon');
      case 'note_prayer': return t('nt.note_prayer', { name: d.name || '' });
      case 'note_enc': return t('nt.note_enc', { name: d.name || '' });
      case 'prayer_approved': return t('nt.prayer_approved');
      case 'pending_new': return t('nt.pending_new');
      case 'pastoral_new': return t('nt.pastoral_new');
      case 'report_new': return t('nt.report_new');
      case 'pipeline_assigned': return t('nt.pipeline_assigned', { name: d.name || '' });
      case 'group_interest': return t('nt.group_interest', { name: d.name || '', group: d.group || '' });
      case 'group_joined': return t('nt.group_joined', { group: d.group || '' });
      case 'event_new': return t(d.full ? 'nt.event_new_full' : 'nt.event_new', { title: d.title || '', when: d.when || '' });
      case 'event_changed': return t('nt.event_changed', { title: d.title || '', when: d.when || '' });
      case 'event_cancelled': return t('nt.event_cancelled', { title: d.title || '', when: d.when || '' });
      case 'event_request': return t('nt.event_request', { name: d.name || '', title: d.title || '' });
      case 'event_waitlist': return t('nt.event_waitlist', { name: d.name || '', title: d.title || '' });

  /** Where tapping an update takes you. */
  function notifTarget(n) {
    if (n.type === 'prayed' || n.type === 'encouraged' || n.type === 'prayer_approved') return ['prayer', 'mine'];
    if (n.type === 'prayer_for_you' || n.type === 'note_prayer' || n.type === 'note_enc') return ['prayer', 'foryou'];
    if (n.type === 'pending_new') return ['prayerCare', 'pending'];
    if (n.type === 'report_new') return ['prayerCare', 'reported'];
    if (n.type === 'pastoral_new') return ['prayerCare', 'pastoral'];
    if (n.type === 'pipeline_assigned') return ['pipeline', 'interested'];
    if (n.type === 'group_interest') return ['groupRequests', ''];
    if (n.type === 'serving_declined' || n.type === 'swap_done') return ['rota', ''];
    if (n.type.indexOf('serving_') === 0 || n.type.indexOf('swap_') === 0) return ['serving', 'mine'];
    if (n.type === 'serve_apply' || n.type === 'serve_waitlist' || n.type === 'serve_spot_open' || n.type === 'team_request') return ['serveManage', ''];
    if (n.type === 'serve_new') return ['serving', 'open'];
    if (n.type === 'serve_approved' || n.type === 'serve_notselected' || n.type === 'serve_cancelled') return ['serving', 'mine'];
    if (n.type === 'team_approved' || n.type === 'team_declined') return ['serving', 'teams'];
    if (n.type === 'group_seek' || n.type === 'group_offer') return ['groupApprovals', ''];
    if (n.type === 'group_ready' || n.type === 'group_match') return ['groups', ''];
    if (n.type === 'group_connected_lead' || n.type === 'group_connected_seek' || n.type === 'group_offer_declined') return ['home', ''];
    if (n.type === 'group_joined' || n.type === 'group_approved') return ['groups', ''];
    if (n.type === 'group_submitted') return ['groupApprovals', ''];
    if (n.type === 'event_request' || n.type === 'event_waitlist' || n.type === 'event_spot_open') return ['eventRequests', n.refId || ''];
    if (n.type === 'event_cancelled') return ['events', ''];
    if (n.type.indexOf('event_') === 0) return n.refId ? ['event', n.refId] : ['events', ''];
    if (n.type === 'group_declined') return ['manageList', 'groups'];
    if (n.type === 'guest_new') return ['guests', 'new'];
    if (n.type === 'wellness_followup') return ['wellnessFlags', ''];
    if (n.type === 'wellness_reminder') return ['wellnessCheck', ''];
    if (n.type === 'testimony_pending' || n.type === 'testimony_published' || n.type === 'story_encouraged') return ['testimonies', ''];
    return ['home', ''];
  }

  const STAGES = ['interested', 'contacted', 'onboarded', 'serving'];

  let peopleData = null;
  let peopleFilter = { q: '', gift: '', ministry: '', availability: '', ready: '', role: '', status: 'active', stage: '' };

  function invalidateDash() { peopleData = null; pipelineData = null; invalidate('dash', 'mgCounts'); }
  function labelMap(list) { const m = {}; (list || []).forEach(function (o) { m[o.value] = o.label; }); return m; }
  function labelsOf(keys, list) { const m = labelMap(list); return (keys || []).map(function (k) { return m[k] || k; }); }
  function sinceText(ms) { return ms ? agoText(ms) : t('dash.never'); }

  /** A horizontal bar list: one hue, label + bar + count. Used for every dashboard chart. */
  function barList(rows, opts) {
    opts = opts || {};
    const max = Math.max.apply(null, rows.map(function (r) { return r.n; }).concat([1]));
    if (!rows.some(function (r) { return r.n; })) return '<p class="muted small">' + esc(opts.empty || t('dash.noData')) + '</p>';
    return '<ul class="hbars' + (opts.stacked ? ' stacked' : '') + '" aria-label="' + esc(opts.title || '') + '">' + rows.map(function (r) {
      const pct = r.n ? Math.max(3, Math.round(r.n / max * 100)) : 0;
      const tip = r.label + ': ' + r.n;
      return '<li class="hbar" title="' + esc(tip) + '"><span class="hbar-label">' + esc(r.label) + '</span>' +
        '<span class="hbar-track" aria-hidden="true"><span class="hbar-fill" style="width:' + pct + '%"></span></span>' +
        '<span class="hbar-n">' + r.n + '</span></li>';
    }).join('') + '</ul>';
  }

  /** Column chart for sign-ups by month (single series, one hue). */
  function columnChart(months) {
    const max = Math.max.apply(null, months.map(function (m) { return m.n; }).concat([1]));
    const short = tList('date.monthsShort');
    return '<div class="cols" role="img" aria-label="' + esc(months.map(function (m) { return short[m.month - 1] + ' ' + m.n; }).join(', ')) + '">' +
      months.map(function (m) {
        const h = m.n ? Math.max(4, Math.round(m.n / max * 100)) : 0;
        return '<div class="col" title="' + esc(short[m.month - 1] + ' ' + m.year + ': ' + m.n) + '">' +
          '<span class="col-n">' + (m.n || '') + '</span>' +
          '<span class="col-track"><span class="col-fill" style="height:' + h + '%"></span></span>' +
          '<span class="col-label">' + esc(short[m.month - 1]) + '</span></div>';
      }).join('') + '</div>';
  }

  function statTile(n, label, go, tab) {
    return '<' + (go ? 'button type="button" data-go="' + go + '"' + (tab ? ' data-tab="' + tab + '"' : '') : 'div') + ' class="stat">' +
      '<span class="stat-n">' + esc(String(n)) + '</span><span class="stat-label">' + esc(label) + '</span></' + (go ? 'button' : 'div') + '>';
  }

  /* ---------------- People ---------------- */
  async function getPeople(fresh) {
    if (!fresh && peopleData) return peopleData;
    peopleData = await api('people.list');
    return peopleData;
  }

  function readyOptions(o) {
    const out = [];
    [['serve', 'dash.r.serve'], ['group', 'dash.r.group'], ['disciple', 'dash.r.disciple']].forEach(function (a) {
      ['ready', 'almost', 'learn'].forEach(function (lvl) {
        out.push({ value: a[0] + ':' + lvl, label: t(a[1]) + ' · ' + t('dash.lvl.' + lvl) });
      });
    });
    return out;
  }
  const READY_LEVELS = { ready: ['ready', 'already'], almost: ['almost'], learn: ['exploring', 'learn'] };

  function filterPeople(items) {
    const f = peopleFilter;
    const q = f.q.trim().toLowerCase();
    return items.filter(function (p) {
      if (q && (p.name + ' ' + p.fullName + ' ' + p.email + ' ' + p.mobile).toLowerCase().indexOf(q) === -1) return false;
      if (f.status && p.status !== f.status) return false;
      if (f.role && p.role !== f.role) return false;
      if (f.gift && p.topGifts.indexOf(f.gift) === -1) return false;
      if (f.ministry && p.ministries.indexOf(f.ministry) === -1) return false;
      if (f.availability && p.availability.indexOf(f.availability) === -1) return false;
      if (f.stage && (f.stage === 'none' ? p.stage : p.stage !== f.stage)) return false;
      if (f.ready) {
        const parts = f.ready.split(':');
        if ((READY_LEVELS[parts[1]] || []).indexOf(p.ready[parts[0]]) === -1) return false;
      }
      return true;
    });
  }

  function selectHtml(name, label, options, value, anyLabel) {

      '<option value="">' + esc(anyLabel || label) + '</option>' +

  function cfgInput(x) {
    const id = 'cfg-' + x.key;
    switch (x.kind) {
      case 'bool':
        return '<label class="switch"><input type="checkbox" id="' + id + '" name="value" data-cfg-auto' + (/^true$/i.test(x.value) ? ' checked' : '') + '><span>' + esc(t('cfg.on')) + '</span></label>';
      case 'color':
        return '<div class="input-pair"><input class="input color-in" type="color" value="' + esc(isHex(x.value) && x.value.length === 7 ? x.value : '#1F3A5F') + '" data-color-for="' + id + '" aria-label="' + esc(x.key) + '">' +
          '<input class="input" id="' + id + '" name="value" value="' + esc(x.value) + '" maxlength="7"><button type="submit" class="btn btn-primary">' + esc(t('common.save')) + '</button></div>';
      case 'long':
        return '<textarea class="input" id="' + id + '" name="value" rows="3" maxlength="2000">' + esc(x.value) + '</textarea><button type="submit" class="btn btn-primary cfg-save">' + esc(t('common.save')) + '</button>';
      default:
        return '<div class="input-pair"><input class="input" id="' + id + '" name="value" value="' + esc(x.value) + '"' +
          (x.kind === 'number' ? ' inputmode="decimal"' : '') + (x.kind === 'url' ? ' type="url" placeholder="https://"' : '') + '>' +
          '<button type="submit" class="btn btn-primary">' + esc(t('common.save')) + '</button></div>';
    }

  function renderSettings() {
    const box = document.getElementById('cfg-list');

    const items = cfgData.items.filter(function (x) { return !q || (x.key + ' ' + x.description + ' ' + x.value).toLowerCase().indexOf(q) !== -1; });
    box.innerHTML = cfgData.groups.map(function (g) {
      const list = items.filter(function (x) { return x.group === g; });
      if (!list.length) return '';
      return '<section class="card cfg-group"><h2>' + esc(t('cfg.g.' + g)) + '</h2>' + list.map(function (x) {
        return '<form class="cfg-row" data-form="cfg" novalidate><input type="hidden" name="key" value="' + esc(x.key) + '">' +
          '<label for="cfg-' + esc(x.key) + '" class="cfg-key">' + esc(x.key) + '</label>' +
          (x.description ? '<p class="muted small cfg-desc">' + esc(x.description) + '</p>' : '') +
          cfgInput(x) + '</form>';

  async function saveFeatureSwitch(input) {
    const key = input.getAttribute('data-ft-key');
    const feature = input.getAttribute('data-ft-feature');
    const on = input.checked;
    input.disabled = true;
    try {
      await api('config.save', { key: key, value: on });
      if (feature) {
        FEATURES[feature] = on;
        dataCache = {};
        state.shellReady = false;          // rebuild the menu so it shows/hides right away
        render();
      }
      if (key === 'PRAYER_REQUIRES_APPROVAL') CFG.prayerRequiresApproval = on;
      if (key === 'BLOCK_IN_APP_BROWSERS') CFG.blockInAppBrowsers = on;
      toast(on ? t('ft.turnedOn') : t('ft.turnedOff'), 3000);
    } catch (e) {
      input.checked = !on;
      toast(e.message, 4000);
    }
    input.disabled = false;
  }

  /** Saves a file in the browser (CSV export). */
  function downloadText(filename, text) {
    try {
      const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.rel = 'noopener';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      return true;
    } catch (e) { return false; }
  }

  /* =======================================================
   * Phase 7: serving schedule, giving, add to home screen

  function slotWhen(s) {
    const time = s.startTime ? fmtClock(s.startTime) + (s.endTime ? '–' + fmtClock(s.endTime) : '') : '';
    return fmtKey(s.date, { weekday: 'short', month: 'short', day: 'numeric' }) + (time ? ' · ' + time : '');
  }
  function fmtClock(hhmm) { const p = String(hhmm).split(':').map(Number); return clock(p[0], p[1]); }
  function statusChip(st) {
    const map = { confirmed: ['chip', '✔ ' + t('sv.st.confirmed')], assigned: ['chip chip-accent', '⏳ ' + t('sv.st.assigned')], declined: ['chip chip-wait', '✖ ' + t('sv.st.declined')],
      applied: ['chip chip-soft', '⏳ ' + t('srv.st.applied')], waitlist: ['chip chip-soft', '🪑 ' + t('srv.st.waitlist')], notselected: ['chip chip-wait', t('srv.st.notselected')] };
    const m = map[st] || map.assigned;
    return '<span class="' + m[0] + '">' + esc(m[1]) + '</span>';
  }

  /* ---------------- Serve: open spots, my schedule, teams ---------------- */
  let servingData = null, serveData = null, serveFilter = 'all';
  function getServe() { return cached('serve', 60000, function () { return api('serve.board'); }); }
  function serveTab() { return ['open', 'mine', 'teams'].indexOf(state.params.tab) !== -1 ? state.params.tab : 'open'; }
  function viewServing() {
    const tab = serveTab();
    const tabBtn = function (k, label) {
      return '<button type="button" class="seg-btn" data-go="serving" data-tab="' + k + '" aria-pressed="' + (tab === k) + '">' + esc(label) + '</button>';
    };
    return pageHead(t('srv.title'), t('srv.sub')) +
      (state.user.leadsMinistry ? '<button type="button" class="btn btn-soft srv-manage-btn" data-go="serveManage">🗂️ ' + esc(t('sm.title')) + '</button>' : '') +
      '<div class="segmented pr-tabs srv-tabs" role="group" aria-label="' + esc(t('srv.title')) + '">' + tabBtn('open', t('srv.tab.open')) + tabBtn('mine', t('srv.tab.mine')) + tabBtn('teams', t('srv.tab.teams')) + '</div>' +
      '<div id="view-body">' + skelCards(2) + '</div>';

  /** The volunteer questionnaire comes first; teams and open spots unlock once it's done. */
  function serveLocked() { return serveData && serveData.volRequired && !serveData.volDone; }
  function serveGateCard() {
    const started = serveData.volStarted;
    return '<section class="card serve-gate"><div class="srv-head"><span class="srv-emoji" aria-hidden="true">🙋</span><div class="srv-title">' +
      '<h2>' + esc(t('srv.gate.title')) + '</h2><p class="muted small">' + esc(t('srv.gate.sub')) + '</p></div></div>' +
      '<ol class="gate-steps"><li class="on">' + esc(t('srv.gate.s1')) + '</li><li>' + esc(t('srv.gate.s2')) + '</li><li>' + esc(t('srv.gate.s3')) + '</li></ol>' +
      '<button type="button" class="btn btn-accent btn-block btn-lg" data-go="q" data-key="volunteer" data-view="serving">' + esc(started ? t('srv.gate.continue') : t('srv.gate.start')) + '</button></section>';
  }
  function lockedBtn() {
    return '<button type="button" class="btn btn-soft btn-block" data-go="q" data-key="volunteer" data-view="serving">🔒 ' + esc(t('srv.gate.locked')) + '</button>';
  }
  async function afterServing() {
    const tab = serveTab();
    if (tab === 'mine') {
      const d = await load(getServing);
      if (!d) return;
      servingData = d;
      return renderServing();
    }
    const b = await load(getServe);
    if (!b) return;
    serveData = b;
    if (tab === 'teams') renderServeTeams(); else renderServeOpen();
    if (serveLocked()) {
      const body = document.getElementById('view-body');
      if (body) body.insertAdjacentHTML('afterbegin', serveGateCard());
    } else if (serveData.volRequired) {
      const body = document.getElementById('view-body');
      if (body) body.insertAdjacentHTML('beforeend', '<p class="muted small" style="text-align:center;margin-top:16px"><button type="button" class="linklike small" data-go="q" data-key="volunteer" data-view="serving">' + esc(t('srv.updateAnswers')) + '</button></p>');
    }
  }

  function spotsBar(filled, spots) {
    if (!spots) return '';
    const pct = Math.min(100, Math.round(filled / spots * 100));
    return '<div class="spots-bar" role="img" aria-label="' + esc(t('srv.filledOf', { filled: filled, spots: spots })) + '"><span style="width:' + pct + '%"></span></div>';
  }
  function serveSpotsChip(o) {
    if (!o.spots) return '';
    return o.spotsLeft > 0 ? '<span class="chip chip-slots">' + esc(t('ev.spotsOf', { left: o.spotsLeft, total: o.spots })) + '</span>'
      : '<span class="chip chip-wait">' + esc(t('ev.full')) + (o.waitCount ? ' · ' + esc(t('srv.waitN', { n: o.waitCount })) : '') + '</span>';
  }
  function openingCard(o) {
    const team = (serveData.ministries || []).find(function (m) { return m.id === o.ministry; }) || {};
    const head = (o.title || o.eventTitle) ? (o.title || o.eventTitle) + ' · ' + o.ministryLabel : o.ministryLabel;
    let act = '';
    const st = o.myStatus;
    if (st === 'confirmed' || st === 'assigned') act = '<p class="rsvp-state ok">🙌 ' + esc(t('srv.youreIn')) + ' <button type="button" class="linklike small" data-go="serving" data-tab="mine">' + esc(t('srv.seeSchedule')) + '</button></p>';
    else if (st === 'applied') act = '<p class="rsvp-state">⏳ ' + esc(t('srv.st.appliedLong')) + '</p><button type="button" class="btn btn-ghost" data-action="serveWithdraw" data-id="' + esc(o.id) + '">' + esc(t('srv.withdraw')) + '</button>';
    else if (st === 'waitlist') act = '<p class="rsvp-state">🪑 ' + esc(t('ev.st.waitLong', { n: o.myWaitPos || 1 })) + '</p><button type="button" class="btn btn-ghost" data-action="serveWithdraw" data-id="' + esc(o.id) + '">' + esc(t('ev.leaveWait')) + '</button>';
    else if (st === 'notselected') act = '<p class="muted small">' + esc(t('srv.st.notselectedLong')) + '</p>' + (o.myNote ? '<blockquote class="greet-msg"><p>' + nl2br(esc(o.myNote)) + '</p></blockquote>' : '');
    else if (st === 'declined') act = '<p class="muted small">' + esc(t('sv.youDeclined')) + '</p>';
    else if (serveLocked()) act = lockedBtn();
    else if (o.teamOnly && team.myStatus !== 'member') {
      act = '<p class="muted small">🔒 ' + esc(t('srv.teamOnlyNote', { ministry: o.ministryLabel })) + '</p>' +
        '<button type="button" class="btn btn-soft btn-block" data-go="serving" data-tab="teams">' + esc(team.myStatus === 'requested' ? t('srv.teamPending') : t('srv.joinTeamFirst', { ministry: o.ministryLabel })) + '</button>';
    } else {
      const label = o.spots && o.spotsLeft === 0 ? t('ev.joinWait') : (o.autoApprove ? t('srv.signUp') : t('srv.apply'));
      act = '<details class="srv-msg"><summary class="linklike small">' + esc(t('srv.addMsg')) + '</summary>' +
          '<textarea class="input" rows="2" maxlength="300" data-snote="' + esc(o.id) + '" aria-label="' + esc(t('ev.msgOrganizer')) + '" placeholder="' + esc(t('srv.msgPh')) + '"></textarea></details>' +
        '<button type="button" class="btn btn-primary btn-block" data-action="serveApply" data-id="' + esc(o.id) + '">' + esc(label) + '</button>' +
        (!o.autoApprove ? '<p class="muted small" style="margin:6px 0 0">' + esc(t('srv.leadApproves')) + '</p>' : '');
    }
    return '<article class="card srv-card">' +
      '<div class="srv-head"><span class="srv-emoji" aria-hidden="true">' + esc(o.emoji || '🙌') + '</span>' +
        '<div class="srv-title"><h3>' + esc(head) + (o.role ? ' · ' + esc(o.role) : '') + '</h3>' +
        '<p class="muted small">' + esc(slotWhen(o)) + (o.leaderName ? ' · ' + esc(t('sv.leader', { name: o.leaderName })) : '') + '</p></div>' +
        serveSpotsChip(o) + '</div>' +
      spotsBar(o.filled, o.spots) +
      (o.notes ? '<p class="small">📝 ' + esc(o.notes) + '</p>' : '') +
      '<div class="srv-act">' + act + '</div></article>';

  function listingCard(l) {
    const aud = t('lg.aud.' + keyOf(l.audience));
    return '<article class="card srv-card lgl-card">' +
      '<div class="srv-head"><span class="srv-emoji" aria-hidden="true">🏡</span><div class="srv-title"><h3>' +
        esc(t(l.count === 1 ? 'lgl.title1' : 'lgl.titleN', { n: l.count, audience: aud, area: l.area || t('lgl.anyArea') })) + '</h3>' +
        '<p class="muted small">' + esc([l.days.join(' · '), l.online ? t('lgl.onlineOk', { n: l.online }) : ''].filter(String).join(' · ') || t('lgl.flexible')) + '</p></div></div>' +
      (l.mine ? '<p class="muted small">' + esc(t('lgl.yours')) + '</p>' : '') +
      (l.myOffer ? '<p class="rsvp-state ok">💛 ' + esc(t('lgl.offeredShort')) + '</p>'
        : '<details class="srv-msg"><summary class="btn btn-soft btn-block">' + esc(t('lgl.couldLead')) + '</summary>' +
            '<textarea class="input" rows="3" maxlength="500" data-lmsg="' + esc(l.key) + '" aria-label="' + esc(t('lgl.offerLabel')) + '" placeholder="' + esc(t('lgl.offerPh')) + '"></textarea>' +
            '<button type="button" class="btn btn-primary btn-block" data-action="groupOffer" data-key="' + esc(l.key) + '" style="margin-top:8px">' + esc(t('lgl.sendOffer')) + '</button>' +
            '<p class="muted small" style="margin:6px 0 0">' + esc(t('lgl.reviewNote')) + '</p></details>') +
      '</article>';

  function renderServeOpen() {
    const d = serveData;
    const body = document.getElementById('view-body');
    if (!d || !body) return;
    const used = {};
    d.openings.forEach(function (o) { used[o.ministry] = true; });
    const chips = d.ministries.filter(function (m) { return used[m.id]; });
    if (serveFilter !== 'all' && !used[serveFilter]) serveFilter = 'all';
    const list = d.openings.filter(function (o) { return serveFilter === 'all' || o.ministry === serveFilter; });
    const sunday = list.filter(function (o) { return o.kind !== 'special'; });
    const special = list.filter(function (o) { return o.kind === 'special'; });
    let html = '';
    if (chips.length > 1) {
      html += '<div class="chips scroll srv-chips" role="group" aria-label="' + esc(t('srv.filter')) + '">' + chipBtn('serveFilter', 'all', t('common.all'), serveFilter === 'all') +
        chips.map(function (m) { return chipBtn('serveFilter', m.id, (m.emoji ? m.emoji + ' ' : '') + m.name, serveFilter === m.id); }).join('') + '</div>';
    }
    if (!list.length) {
      html += '<div class="card empty"><div class="empty-emoji" aria-hidden="true">🌱</div><p class="muted">' + esc(t('srv.noOpen')) + '</p>' +
        '<button type="button" class="btn btn-soft" data-go="serving" data-tab="teams">' + esc(t('srv.seeTeams')) + '</button></div>';
    }
    if (sunday.length) {
      let last = '';
      html += '<h2 class="srv-sec">' + esc(t('srv.sec.sunday')) + '</h2>' + sunday.map(function (o) {
        const h = o.date !== last ? '<h3 class="rota-date">' + esc(fmtKey(o.date, { weekday: 'long', month: 'long', day: 'numeric' })) + '</h3>' : '';
        last = o.date;
        return h + openingCard(o);
      }).join('');
    }
    if (special.length) html += '<h2 class="srv-sec">' + esc(t('srv.sec.special')) + '</h2>' + special.map(openingCard).join('');
    if (FEATURES.smallGroups !== false && d.listings && d.listings.length) {
      html += '<h2 class="srv-sec">' + esc(t('lgl.sec')) + '</h2><p class="muted small" style="margin:-4px 0 10px">' + esc(t('lgl.secSub')) + '</p>' + d.listings.map(listingCard).join('');
    }
    body.innerHTML = html;

          '<p class="muted small">' + esc([m.leads.length ? t('srv.leadsList', { names: m.leads.join(', ') }) : '', t(m.teamSize === 1 ? 'srv.team1' : 'srv.teamN', { n: m.teamSize })].filter(String).join(' · ')) + '</p></div>' +

  function renderServing() {
    const d = servingData;
    const body = document.getElementById('view-body');
    if (!d || !body) return;
    let html = '';
    d.incoming.forEach(function (r) {
      html += '<section class="card soft-note"><p><strong>' + esc(t('sv.swapAsk', { name: r.fromName })) + '</strong></p>' +
        '<p>' + esc(r.slot.ministryLabel + (r.slot.role ? ' · ' + r.slot.role : '')) + '<br><span class="muted">' + esc(slotWhen(r.slot)) + '</span></p>' +
        (r.message ? '<blockquote class="greet-msg"><p>' + esc(r.message) + '</p></blockquote>' : '') +
        '<div class="row"><button type="button" class="btn btn-primary" data-action="swapRespond" data-id="' + esc(r.id) + '" data-accept="1">' + esc(t('sv.swapYes')) + '</button>' +
        '<button type="button" class="btn btn-ghost" data-action="swapRespond" data-id="' + esc(r.id) + '" data-accept="0">' + esc(t('sv.swapNo')) + '</button></div></section>';
    });
    const serving = d.items.filter(function (i) { return ['assigned', 'confirmed', 'declined'].indexOf(i.status) !== -1; });
    const apps = d.items.filter(function (i) { return ['applied', 'waitlist', 'notselected'].indexOf(i.status) !== -1; });
    if (!serving.length && !apps.length) {
      html += '<div class="card empty"><div class="empty-emoji" aria-hidden="true">🙌</div><p class="muted">' + esc(t('sv.empty')) + '</p>' +
        '<button type="button" class="btn btn-accent" data-go="serving" data-tab="open">' + esc(t('srv.findSpot')) + '</button></div>';
    }
    if (serving.length) {
      html += '<div class="stack">' + serving.map(function (i) {
        const s = i.slot;
        const actions = i.status === 'declined'
          ? '<p class="muted small">' + esc(t('sv.youDeclined')) + '</p>'
          : (i.status === 'assigned' ? '<button type="button" class="btn btn-primary" data-action="servingRespond" data-id="' + esc(i.assignmentId) + '" data-do="confirm">' + esc(t('sv.confirm')) + '</button>' : '') +

  /** Approve / decline buttons on the lead console (applicants and team requests). */
  async function leadDecide(el, action) {
    const id = el.getAttribute('data-id');
    const noteEl = document.querySelector('[data-dnote="' + id + '"]');
    const li = el.closest('.er-person');
    const btns = li ? li.querySelectorAll('button') : [el];
    Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });
    try {
      const res = await api(action, { id: id, decision: el.getAttribute('data-decision'), note: noteEl ? noteEl.value : '' });
      toast(res.message, 3500);
      invalidate('mgCounts', 'serve');
      afterServeManage();
    } catch (e) {
      Array.prototype.forEach.call(btns, function (b) { b.disabled = false; });
      toast(e.message, 4500);
    }
  }

  // Android/Chrome offers a real install prompt on the app page; keep it for the Install button.
  let installPromptEvent = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    installPromptEvent = e;
    if (state.route === 'install' && document.getElementById('main')) document.getElementById('main').innerHTML = viewInstall();
  });
  function triggerInstall() {
    if (!installPromptEvent) return go('install', {}, true);
    const ev = installPromptEvent;
    try { ev.prompt(); } catch (e) { return go('install', {}, true); }
    ev.userChoice.then(function (choice) {
