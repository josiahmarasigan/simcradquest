<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rad Quest</title>
<meta name="theme-color" content="#0f1530">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rad Quest">
<style>
  html,body{margin:0;background:#0f1530;color:#e8f0ff;font-family:monospace}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
  .t{color:#7cff6b;font-weight:bold;letter-spacing:.3em}
  .m{color:#a9b6e0;max-width:320px;line-height:1.4}
  .blink{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
  button{font-family:monospace;font-weight:bold;letter-spacing:.2em;background:#ffc93c;color:#0f1530;border:0;padding:14px 18px;min-height:44px;cursor:pointer}
</style>
<script src="config.js"></script>
</head>
<body>
<!--
  Rad Quest loader. Set up once on GitHub Pages, then leave it alone.
  The real screens come from App.html in Apps Script: deploy a new version there and every phone updates.
-->
<div class="wrap" id="wrap"><div class="t">RAD QUEST</div><div class="m blink">LOADING...</div></div>
<script>
(function () {
  var API = String((window.RAD_QUEST && window.RAD_QUEST.API_URL) || '').trim();
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
  function codeFrom(t) {
    var m = String(t || '').match(/[?&]u=([a-z0-9]{6,40})/i);
    return m ? m[1] : '';
  }
  var token = codeFrom(location.search) || get('rq_token') || '';
  if (token) set('rq_token', token);
  var cached = null;
  try { cached = JSON.parse(get('rq_ui') || 'null'); } catch (e) { cached = null; }
  if (cached && (!cached.html || !cached.v)) cached = null;

  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () { }); }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function problem(title, text) {
    document.getElementById('wrap').innerHTML = '<div class="t" style="color:#ff8f8f">' + esc(title) + '</div><div class="m">' + esc(text) + '</div><button type="button" onclick="location.reload()">TRY AGAIN</button>';
  }
  /** Replace this page with the app, handing it the server address and the data we already fetched. */
  function show(html, boot) {
    var inject = '<script>window.RQ_API=' + JSON.stringify(API) + ';window.RQ_BOOT=' + JSON.stringify(boot || null).replace(/</g, '\\u003c') + ';<\/script>';
    html = html.indexOf('<!--RQ_INJECT-->') >= 0 ? html.replace('<!--RQ_INJECT-->', inject) : html.replace('<head>', '<head>' + inject);
    document.open();
    document.write(html);
    document.close();
  }

  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API)) {
    problem('SETUP NEEDED', 'Put your Apps Script web app URL (it ends in /exec) in config.js.');
    return;
  }

  var done = false;
  // Slow signal? Open the saved copy after a few seconds; the new one is kept for next time.
  var timer = setTimeout(function () { if (!done && cached) { done = true; show(cached.html, null); } }, 6000);

  fetch(API, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: 'boot', args: [token, cached ? cached.v : ''] }),
    cache: 'no-store', credentials: 'omit', redirect: 'follow'
  })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text().then(function (t) {
        try { return JSON.parse(t); } catch (x) {
          // Google answered with a web page, e.g. "Script function not found: doPost"
          var err = new Error('The server answered, but it is not running the Rad Quest app code.');
          err.server = true;
          throw err;
        }
      });
    })
    .then(function (j) {
      if (!j || !j.ok) {
        var err = new Error((j && j.error) || 'The server sent an error.');
        err.server = true;
        throw err;
      }
      var b = j.value;
      if (b.ui) set('rq_ui', JSON.stringify(b.ui));
      if (done) return;
      done = true; clearTimeout(timer);
      var ui = b.ui || cached;
      if (!ui) throw new Error('The server did not send the app.');
      show(ui.html, { token: token, data: b.data || null, error: b.error || '' });
    })
    .catch(function (e) {
      if (done) return;
      done = true; clearTimeout(timer);
      if (e && e.server) { problem('SERVER PROBLEM', e.message + ' (Is the newest Code.gs deployed as a new version?)'); return; }
      if (cached) { show(cached.html, null); return; }
      problem('CAN\'T START', 'Can\'t reach the Rad Quest server. Check your connection and try again.');
    });
})();
</script>
</body>
</html>
