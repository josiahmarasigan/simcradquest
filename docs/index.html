<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rad Quest</title>
<meta name="theme-color" content="#0f1530">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rad Quest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#0f1530; --panel:#1b2450; --line:#3a4a8c; --deep:#060914; --text:#e8f0ff; --muted:#a9b6e0;
    --green:#7cff6b; --green-d:#3c9a32; --gold:#ffc93c; --gold-d:#a86a00; --pink:#ff6fa3; --off:#2a3566; --red:#ff8f8f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);color:var(--text);font-family:'VT323',monospace;font-size:20px}
  .px{font-family:'Press Start 2P',monospace}
  .app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:16px 16px 0}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .brand{font-size:11px;color:var(--green)}
  .who{color:var(--muted);font-size:19px;margin-top:6px}
  .hud{display:flex;align-items:center;gap:8px}
  .coin{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--line);padding:6px 10px}
  .coin span{font-size:12px;color:var(--gold)}
  .iconbtn{font-family:'Press Start 2P',monospace;font-size:10px;width:44px;height:44px;background:var(--panel);border:3px solid var(--line);color:var(--muted);cursor:pointer}
  .iconbtn[aria-pressed="true"]{color:var(--green);border-color:var(--green)}
  #busy{height:3px;margin-top:10px;background:transparent}
  #busy.on{background:linear-gradient(90deg,var(--green) 0 30%,transparent 30%);background-size:200% 100%;animation:slide .8s steps(8) infinite}
  @keyframes slide{from{background-position:100% 0}to{background-position:-100% 0}}
  main{flex:1;padding:12px 0 96px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--panel);border:3px solid var(--line);padding:12px}
  .label{font-size:9px;color:var(--muted)}

  /* pet screen */
  .monitor{background:var(--deep);border:4px solid var(--line);box-shadow:4px 4px 0 #050712;height:316px;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;padding:40px 10px 6px}
  .mood{font-size:22px;text-align:center;line-height:1}
  .monitor.room-ct{background:radial-gradient(circle at 50% 50%, #060914 0 92px, #2a3566 93px 118px, #060914 119px)}
  .monitor.room-night{background-color:#05071a;background-image:radial-gradient(#ffffff 1px,transparent 1.5px),radial-gradient(#8fd3ff 1px,transparent 1.5px);
    background-size:46px 46px,73px 73px;background-position:0 0,20px 30px}
  .monitor .tl{position:absolute;top:6px;left:8px}
  .monitor .tr{position:absolute;top:14px;right:12px;font-size:9px;color:var(--muted)}
  .namebtn{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--green);background:transparent;border:0;padding:8px 4px;min-height:32px;cursor:pointer;text-decoration:underline dotted;text-underline-offset:4px}
  .bubble{position:absolute;top:34px;background:var(--text);color:var(--ground);font-family:'Press Start 2P',monospace;font-size:9px;padding:8px 10px;border:3px solid var(--green);max-width:84%;text-align:center;line-height:1.5;z-index:2}
  .petbtn{background:transparent;border:0;padding:0;cursor:pointer;display:block;position:relative}
  .pet{display:block}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes hop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(0) rotate(6deg)}}
  @keyframes munch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.93) translateY(6px)}}
  @keyframes eyesO{0%,93%{opacity:1}94%,100%{opacity:0}}
  @keyframes eyesC{0%,93%{opacity:0}94%,100%{opacity:1}}
  @keyframes chomp{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.15}}
  @keyframes zfloat{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(18px,-46px);opacity:0}}
  @keyframes drop{0%{transform:translateY(-120px);opacity:1}70%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
  @keyframes flash{0%{filter:brightness(6)}100%{filter:brightness(1)}}
  @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
  .pet.idle{animation:bob 1.6s steps(4) infinite}
  .pet.happy{animation:hop .4s steps(4) 3}
  .pet.eat{animation:munch .3s steps(2) 5}
  .pet .eo{animation:eyesO 4.2s steps(1) infinite}
  .pet .ec{opacity:0;animation:eyesC 4.2s steps(1) infinite}
  .pet.sleep .eo{animation:none;opacity:0}
  .pet.sleep .ec{animation:none;opacity:1}
  .pet.sleep{opacity:.75}
  .pet .mo{opacity:0}
  .pet.eat .mo{animation:chomp .3s steps(1) 5}
  .pet .sp{animation:twinkle 1.1s steps(2) infinite}
  .pet.flash{animation:flash .9s steps(6) 1}
  .egg{animation:wobble .6s steps(4) infinite}
  .zzz{position:absolute;right:-6px;top:10px;font-family:'Press Start 2P',monospace;font-size:12px;color:var(--muted);animation:zfloat 2.4s steps(8) infinite}
  .zzz.b{animation-delay:1.2s;font-size:9px}
  .snack{position:absolute;left:50%;top:44%;margin-left:-8px;width:16px;height:16px;background:#ff9f43;box-shadow:inset -4px -4px 0 #c96a12;animation:drop .7s steps(7) 1 forwards}
  .shadow{width:120px;height:8px;background:var(--panel)}
  .segs{display:grid;gap:3px}
  .seg{height:14px;background:var(--off)}
  .statrow{display:grid;grid-template-columns:92px minmax(0,1fr) 28px;align-items:center;gap:8px}
  .statrow .segs{grid-template-columns:repeat(10,minmax(0,1fr));gap:2px}
  .statrow .seg{height:10px}

  /* controls */
  .btn{font-family:'Press Start 2P',monospace;font-size:10px;border:0;padding:12px 8px;min-height:44px;cursor:pointer;color:var(--ground)}
  .btn:disabled{cursor:default;opacity:.65}
  .btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
  .btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d)}
  .btn.ghost{background:var(--off);color:#c7d0f0;box-shadow:none}
  .btn:active{transform:translateY(3px);box-shadow:none}
  .btn.sm{font-size:9px;min-height:40px;padding:8px 10px}
  a.btn,label.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .hint{color:var(--muted);text-align:center;font-size:18px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tab{font-family:'Press Start 2P',monospace;font-size:8px;padding:10px 8px;min-height:40px;cursor:pointer;background:transparent;border:2px solid currentColor}
  .tab[aria-selected="true"]{color:var(--ground)!important}
  .item{background:var(--panel);border:3px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
  .item.ok{border-color:var(--green)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .title{font-size:22px;line-height:1}
  .tag{font-size:8px;color:var(--ground);padding:5px 6px;flex-shrink:0}
  .meta{font-size:18px;color:var(--muted);line-height:1.15}
  .meta a,.linkish{color:var(--green);text-decoration:underline;word-break:break-all}
  .status{font-size:8px;padding:8px;border:2px solid}
  .bar{flex:1;height:10px;background:var(--off)}
  .bar > div{height:10px}
  .flag{color:var(--red);font-size:18px}
  .boss{background:#2a1030;border:4px solid var(--pink);box-shadow:4px 4px 0 #050712;padding:12px;display:flex;flex-direction:column;gap:8px}
  .boss .segs{grid-template-columns:repeat(20,minmax(0,1fr));gap:2px}
  .boss .seg{height:10px;background:#4a2050}
  table{width:100%;border-collapse:collapse}
  td,th{text-align:left;padding:6px 4px;border-bottom:2px solid var(--line);font-weight:normal}
  th{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--muted)}
  tr.mine td{color:var(--green)}

  /* forms */
  .field{display:flex;flex-direction:column;gap:4px}
  .field > span,.legend{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--muted);line-height:1.5}
  input[type=text],input[type=number],input[type=date],input[type=url],input[type=password],select,textarea{
    font-family:'VT323',monospace;font-size:20px;background:var(--deep);color:var(--text);border:2px solid var(--line);padding:8px;width:100%;border-radius:0}
  input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,.filebtn:focus-within{outline:3px solid var(--gold);outline-offset:1px}
  textarea{min-height:76px;resize:vertical}
  .checks{display:flex;flex-wrap:wrap;gap:12px;font-size:20px}
  .checks label{display:flex;align-items:center;gap:8px;min-height:32px}
  .checks input{width:22px;height:22px;accent-color:var(--green);flex-shrink:0}
  .proofs{display:flex;flex-wrap:wrap;gap:8px}
  .thumb{position:relative;width:96px;height:96px;border:2px solid var(--line);background:var(--deep);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}
  .thumb img{display:block;width:100%;height:100%;object-fit:cover}
  .thumb .x{position:absolute;top:-2px;right:-2px;width:32px;height:32px;background:var(--ground);border:2px solid var(--red);color:var(--red);font-family:'Press Start 2P',monospace;font-size:10px;cursor:pointer}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .err{color:var(--red);font-size:19px;min-height:20px}

  /* nav, overlay, toast */
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--ground);border-top:3px solid var(--line);z-index:5}
  nav .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
  #net{color:var(--gold)}
  nav .in.admin{grid-template-columns:repeat(5,minmax(0,1fr))}
  nav button{font-family:'Press Start 2P',monospace;font-size:9px;border:0;padding:14px 0;background:var(--panel);color:var(--text);cursor:pointer;min-height:44px;position:relative}
  nav .in.admin button{font-size:8px}
  nav button[aria-current="page"]{background:var(--green);color:var(--ground)}
  .badge{position:absolute;top:-8px;right:2px;background:var(--pink);color:var(--ground);font-size:8px;padding:4px 5px}
  #overlay{position:fixed;inset:0;background:rgba(6,9,20,.88);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 14px}
  #overlay[hidden]{display:none}
  .sheet{width:100%;max-width:420px;background:var(--ground);border:4px solid var(--line);box-shadow:6px 6px 0 #050712;padding:16px;display:flex;flex-direction:column;gap:12px;margin:auto 0}
  .sheet h2{margin:0;font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.6;color:var(--gold);font-weight:normal}
  .news{display:flex;flex-direction:column;gap:8px}
  .news .n{border-left:0;background:var(--panel);padding:8px 10px;display:flex;justify-content:space-between;gap:10px;font-size:20px;line-height:1.1}
  .news .n.bad{color:var(--red)}
  .big{font-family:'Press Start 2P',monospace;font-size:13px;line-height:1.7;text-align:center;color:var(--green)}
  .stage{display:flex;align-items:center;justify-content:center;gap:14px;min-height:150px;background:var(--deep);border:3px solid var(--line)}
  .zoom img{width:100%;height:auto;display:block;border:2px solid var(--line)}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--text);color:var(--ground);font-family:'Press Start 2P',monospace;
    font-size:9px;line-height:1.6;padding:10px 12px;border:3px solid var(--green);max-width:360px;width:calc(100% - 32px);text-align:center;display:none;z-index:30}
  .toast.err{border-color:#d43b3b}
  .center{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:16px}
  .blink{animation:blinkT 1s steps(1) infinite}@keyframes blinkT{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important} .pet .ec{opacity:0} .pet.sleep .ec{opacity:1} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="px brand">RAD QUEST<span id="net" hidden> · OFFLINE</span></div>
      <div class="who" id="who">&nbsp;</div>
    </div>
    <div class="hud">
      <button type="button" class="iconbtn" id="sndBtn" aria-pressed="false" aria-label="Sound effects">♪</button>
      <div class="coin" aria-label="Coins">
        <svg viewBox="0 0 8 8" width="20" height="20" shape-rendering="crispEdges" aria-hidden="true" id="coinIcon"></svg>
        <span class="px" id="coins">--</span>
      </div>
    </div>
  </header>
  <div id="busy" aria-hidden="true"></div>
  <main id="main"><div class="center"><div class="px blink" style="font-size:11px">LOADING...</div></div></main>
</div>
<nav aria-label="Main menu"><div class="in" id="navIn">
  <button type="button" data-go="pet" aria-current="page">PET</button>
  <button type="button" data-go="quests">QUESTS</button>
  <button type="button" data-go="shop">SHOP</button>
  <button type="button" data-go="team">TEAM</button>
  <button type="button" data-go="admin" id="adminNav" hidden>ADMIN</button>
</div></nav>
<div id="overlay" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
(function () {
  var API_URL = String((window.RAD_QUEST && window.RAD_QUEST.API_URL) || '').trim();
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { } }
  };
  /** A personal link ends in ?u=CODE. Accept the whole link or just the code. */
  function codeFrom(text) {
    var m = String(text || '').match(/[?&]u=([a-z0-9]{6,40})/i) || String(text || '').trim().match(/^([a-z0-9]{6,40})$/i);
    return m ? m[1] : '';
  }
  var TOKEN = codeFrom(location.search) || store.get('rq_token') || '';
  if (TOKEN) store.set('rq_token', TOKEN);
  var S = null;               // state from server
  var view = 'pet';
  var questTab = 'ALL';
  var shopTab = 'REAL';
  var confirmId = null;       // shop item waiting for a second tap
  var busy = 0;
  var bubble = '';
  var anim = { type: '', until: 0 };
  var lastSync = Date.now();
  var STAT_COLORS = { SKILL: '#ff9f43', SHIELD: '#4dabff', WISDOM: '#b48cff', HEART: '#ff6fa3', VITAL: '#7cff6b' };
  var REPEAT_LABEL = { once: 'one-time', daily: 'daily', weekly: 'weekly', monthly: 'monthly', unlimited: 'repeatable' };
  var $ = function (id) { return document.getElementById(id); };

  // ───────── pixel art ─────────
  var SPR = {
    'PIXEL PUP': ['................', '................', '................', '................', '................', '.....######.....', '....########....', '...##########...', '...#EE####EE#...', '...#EW####EW#...', '...pp######pp...', '...##########...', '...##########...', '....########....', '....##.##.##....', '................'],
    'PHANTOM': ['................', '.....######.....', '...##########...', '..############..', '..##EE####EE##..', '..##EW####EW##..', '.#pp########pp#.', '.####rrrrrr####.', '.######rr######.', '.####rrrrrr####.', '.######rr######.', '.####rrrrrr####.', '..############..', '..##..####..##..', '..##........##..', '................'],
    'PHANTOM+': ['..h..........h..', '..hh........hh..', '...h########h...', '..############..', '..##EE####EE##..', '..##EW####EW##..', '.#pp########pp#.', '.####rrrrrr####.', '.######rr######.', '.####rrrrrr####.', '.######rr######.', '.####rrrrrr####.', '.##############.', '.##.###..###.##.', '.#..##....##..#.', '................'],
    'GUARDIAN': ['....c..cc..c....', '....cccccccc....', '...##########...', '..############..', '..##EE####EE##..', '..##EW####EW##..', 'c#pp########pp#c', 'c####rrrrrr####c', '.######rr######.', '.####rrrrrr####.', '.######rr######.', '.####rrrrrr####.', '..############..', '..##..####..##..', '..##........##..', '................'],
    'RADIANT GUARDIAN': ['.s..c..cc..c..s.', '....cccccccc....', '...##########...', '..############..', 'w.##EE####EE##.w', 'ww##EW####EW##ww', 'wwpp########ppww', 'w####rrrrrr####w', '.######rr######.', '.####rrrrrr####.', '.######rr######.', '.####rrrrrr####.', '..############..', '..##..####..##..', '.s##........##s.', '................'],
    'EGG': ['................', '......####......', '.....######.....', '....########....', '....##o#####....', '...###oo#####...', '...##########...', '...####o#####...', '...###ooo####...', '...##########...', '....########....', '....########....', '.....######.....', '......####......', '................', '................']
  };
  var LOOK = {
    'PIXEL PUP': { body: '#8fd3ff', glow: 'rgba(143,211,255,.45)' },
    'PHANTOM': { body: '#8fd3ff', glow: 'rgba(143,211,255,.6)' },
    'PHANTOM+': { body: '#b9a4ff', glow: 'rgba(180,140,255,.65)' },
    'GUARDIAN': { body: '#ffd36b', glow: 'rgba(255,201,60,.65)' },
    'RADIANT GUARDIAN': { body: '#a6ffa0', glow: 'rgba(124,255,107,.8)' },
    'EGG': { body: '#f4ecd8', glow: 'rgba(244,236,216,.4)' }
  };
  var PIX = { p: '#ff8fb8', r: '#eaf7ff', h: '#ff6fa3', c: '#ffc93c', w: '#ffffff', o: '#7cff6b' };
  var NEXT_FORM = {
    'PIXEL PUP': 'Reach level 3 to evolve.',
    'PHANTOM': 'Level 6 evolves. Keep every stat at 4+ for the Guardian form.',
    'PHANTOM+': 'Raise every stat to 4+ to become a Guardian.',
    'GUARDIAN': 'Level 9 with every stat at 7+ unlocks the final form.',
    'RADIANT GUARDIAN': 'Final form reached. Legendary!'
  };
  var COIN = ['..####..', '.#yyyy#.', '#yyWyyy#', '#yyWyyy#', '#yyyyyy#', '#yyyyyy#', '.#yyyy#.', '..####..'];

  function px(x, y, c, w, h) { return '<rect x="' + x + '" y="' + y + '" width="' + (w || 1) + '" height="' + (h || 1) + '" fill="' + c + '"/>'; }
  function petSvg(form, cosmetics, size) {
    var map = SPR[form] || SPR.PHANTOM, look = LOOK[form] || LOOK.PHANTOM;
    var body = '', eo = '', ec = '', sp = '', extra = '', eyeBottom = -1, top = 99, x, y, ch;
    for (y = 0; y < 16; y++) for (x = 0; x < 16; x++) { ch = map[y].charAt(x); if ((ch === 'E' || ch === 'W') && y > eyeBottom) eyeBottom = y; if (ch === '#' && y < top) top = y; }
    for (y = 0; y < 16; y++) for (x = 0; x < 16; x++) {
      ch = map[y].charAt(x);
      if (ch === '.') continue;
      if (ch === 'E' || ch === 'W') {
        body += px(x, y, look.body);
        eo += px(x, y, ch === 'E' ? '#0f1530' : '#ffffff');
        if (y === eyeBottom) ec += px(x, y, '#0f1530');
      } else if (ch === 's') sp += px(x, y, '#fff4c2');
      else body += px(x, y, ch === '#' ? look.body : PIX[ch]);
    }
    var mo = eyeBottom >= 0 ? px(7, eyeBottom + 1, '#0f1530', 2, 2) : '';
    cosmetics = cosmetics || [];
    if (cosmetics.indexOf('cape') >= 0) {
      for (y = 6; y <= 13; y++) {
        var l = map[y].search(/[#pr]/), r = Math.max(map[y].lastIndexOf('#'), map[y].lastIndexOf('p'));
        if (l > 0) extra += px(l - 1, y, '#6b7a99');
        if (r >= 0 && r < 15) extra += px(r + 1, y, '#6b7a99');
      }
    }
    if (cosmetics.indexOf('hat') >= 0 && top < 99) {
      var hy = Math.max(0, top - 1);
      extra += px(8, hy, '#c7d0f0', 5, 1) + px(9, Math.max(0, hy - 1), '#c7d0f0', 3, 1) + px(10, hy, '#ffc93c', 1, 1);
    }
    return '<svg viewBox="0 0 16 16" width="' + size + '" height="' + size + '" shape-rendering="crispEdges" aria-hidden="true"><g>' + body + '</g><g class="eo">' + eo + '</g><g class="ec">' + ec + '</g><g class="mo">' + mo + '</g><g class="sp">' + sp + '</g>' + extra + '</svg>';
  }
  (function () {
    var s = '', cols = { '#': '#a86a00', y: '#ffc93c', W: '#fff4c2' };
    for (var y = 0; y < 8; y++) for (var x = 0; x < 8; x++) { var c = cols[COIN[y].charAt(x)]; if (c) s += px(x, y, c); }
    $('coinIcon').innerHTML = s;
  })();

  // ───────── sound (off until switched on) ─────────
  var Snd = (function () {
    var ctx = null, on = false;

  function shrink(file, cb) {

        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        cb(c.toDataURL('image/jpeg', 0.72));
      } catch (e) { URL.revokeObjectURL(url); cb(null); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(null); };

  }

      });
      return;
    }
    var qf = t.getAttribute('data-qfilter'); if (qf) { A.filter = qf; render(); return; }
    if (t.getAttribute('data-qnew')) {
      A.edit = { id: '', title: '', stat: 'SKILL', roles: 'ALL', coins: 30, xp: 50, proof: '', repeat: 'monthly', description: '', link: '', startDate: '', endDate: '', maxClaims: '', active: true };
      render(); window.scrollTo(0, 0); return;
    }
    var qe = t.getAttribute('data-qedit');
    if (qe) { A.edit = Object.assign({}, A.quests.filter(function (x) { return x.id === qe; })[0]); render(); window.scrollTo(0, 0); return; }
    if (t.getAttribute('data-qcancel')) { A.edit = null; render(); return; }
    if (t.getAttribute('data-qsave')) {
      var data = readQuestForm();
      A.edit = data; // keep what was typed if saving fails
      t.disabled = true;
      adminRun('adminSaveQuest', [data], function (r) { A.quests = r.quests; A.edit = null; render(); toast(r.message); refresh(); });
      return;
    }
    var tog = t.getAttribute('data-qtoggle');
    if (tog) {
      t.disabled = true;
      adminRun('adminToggleQuest', [tog, t.getAttribute('data-on') === '1'], function (r) { A.quests = r.quests; render(); toast(r.message); refresh(); });
      return;
    }
  });

  // pick up approvals when the player comes back to the tab
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && S && !O && Date.now() - lastSync > 60000) refresh();
  });

  // ───────── start ─────────
  function message(title, text, extra, color) {
    $('main').innerHTML = '<div class="center"><div class="px" style="font-size:11px;line-height:1.8;color:' + (color || 'var(--text)') + '">' + title + '</div><div class="meta">' + text + '</div>' + (extra || '') + '</div>';
  }
  function showLogin(err) {
    S = null; $('who').textContent = '\u00a0'; $('coins').textContent = '--'; $('adminNav').hidden = true;
    message('WELCOME, PLAYER', 'Open the personal link from your Rad Quest email, or paste the link (or its code) here.',
      '<label class="field" style="width:100%;text-align:left"><span>YOUR LINK OR CODE</span><input type="text" id="loginIn" autocomplete="off" autocapitalize="none" spellcheck="false"></label>' +
      '<div class="err" id="loginErr" role="alert">' + esc(err || '') + '</div><button type="button" class="btn green" id="loginBtn" style="width:100%">START</button>');
  }
  function signIn() {
    var code = codeFrom($('loginIn').value);
    if (!code) { $('loginErr').textContent = 'That doesn\'t look like a Rad Quest link or code.'; return; }
    TOKEN = code; store.set('rq_token', code); start();
  }
  function start() {
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL)) {
      message('SETUP NEEDED', 'Put your Apps Script web app URL (it ends in /exec) in config.js.', '', 'var(--gold)');
      return;
    }
    if (!TOKEN) { showLogin(''); return; }
    // 1) paint the last known state straight away
    try {
      var saved = JSON.parse(store.get('rq_state') || 'null');
      if (saved && saved.token === TOKEN && saved.state) { S = saved.state; render(); }
    } catch (e) { }
    if (!S) message('<span class="blink">LOADING...</span>', '');
    // 2) then ask the server for the latest, plus what happened while away
    run('open', [TOKEN], function (d) {
      S = d.state; render();
      if (O) return;
      if (d.news.length || d.levelUp || d.evolved) queue.push(function () { showNews(d); });
      if (d.hatch) showHatch(); else if (queue.length) (queue.shift())();
    }, function (m) {
      if (/not active/.test(m)) { store.del('rq_token'); store.del('rq_state'); TOKEN = ''; showLogin(m); return; }
      if (S) { toast('Offline: showing your last saved pet.', true); return; }
      message('CAN\'T START', esc(m), '<button type="button" class="btn gold" id="retryBtn">TRY AGAIN</button>', 'var(--red)');
    });
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target && e.target.id === 'loginIn') signIn(); });
  window.addEventListener('online', function () { setOnline(true); if (S && !O) refresh(); });
  window.addEventListener('offline', function () { setOnline(false); });
  start();

  // the service worker keeps the app's own files on the phone, so it opens instantly and can be installed
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }
})();
</script>
</body>
</html>
